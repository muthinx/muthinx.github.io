<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Muthinx · App Portal</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
                   RESET & GLOBAL (sama persis dengan note.html)
                   ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6;
            overflow: hidden;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --sidebar-bg: #f4f6fa;
            --sidebar-hover: #e9ecf2;
            --sidebar-active: #dde1e9;
            --sidebar-border: #dce0e8;
            --sidebar-text: #1a1a2e;
            --sidebar-text-dim: #6b7280;
            --accent: #4f6ef7;
            --accent-hover: #3a55d9;
            --accent-glow: rgba(79, 110, 247, 0.25);
            --main-bg: #f0f2f6;
            --paper-bg: #ffffff;
            --paper-text: #1a1a2e;
            --header-bg: rgba(255, 255, 255, 0.72);
            --border-light: #e6e9f0;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Dark theme (opsional, untuk konsistensi) */
        [data-theme="dark"] {
            --sidebar-bg: #18182a;
            --sidebar-hover: #22223a;
            --sidebar-active: #2a2a48;
            --sidebar-border: #2a2a48;
            --sidebar-text: #f0f0f8;
            --sidebar-text-dim: #8a8ea0;
            --main-bg: #0f0f1a;
            --paper-bg: #1e1e32;
            --paper-text: #f0f0f8;
            --header-bg: rgba(20, 20, 40, 0.80);
            --border-light: #2a2a48;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.40);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.50);
            --accent: #6a84ff;
            --accent-hover: #5a74ef;
            --accent-glow: rgba(106, 132, 255, 0.30);
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8ccd8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8aec0;
        }

        /* ============================================================
                   APP LAYOUT (sama dengan note.html)
                   ============================================================ */
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* ===== SIDEBAR (sama persis) ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            transition: transform var(--transition), min-width var(--transition);
            z-index: 100;
            flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            position: relative;
        }

        .sidebar-header {
            padding: 22px 20px 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .sidebar-logo {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--sidebar-text);
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .sidebar-title span {
            color: var(--accent);
        }

        .sidebar-actions {
            padding: 14px 16px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-sidebar {
            display: flex;
            flex: 1;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.04);
            color: var(--sidebar-text);
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            width: 100%;
            justify-content: center;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .btn-sidebar:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .btn-sidebar:active {
            transform: scale(0.96);
        }
        .btn-sidebar svg {
            flex-shrink: 0;
            opacity: 0.7;
        }
        .btn-sidebar-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-sidebar-primary:hover {
            background: var(--accent-hover);
            color: #fff;
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        /* ----- DAFTAR APPS (mirip file-list) ----- */
        .app-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 20px 10px;
            position: relative;
            z-index: 1;
        }

        .app-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), transform 0.12s;
            position: relative;
            color: var(--sidebar-text);
            gap: 8px;
        }
        .app-item:hover {
            background: var(--sidebar-hover);
        }
        .app-item.active {
            background: var(--sidebar-active);
            box-shadow: inset 3px 0 0 var(--accent);
            font-weight: 500;
        }

        .app-item-icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }
        .app-item-name {
            font-size: 14px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 4px;
            letter-spacing: 0.1px;
        }
        .app-item-badge {
            font-size: 10px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--sidebar-hover);
            color: var(--sidebar-text-dim);
            border: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }
        .app-item-badge.live {
            color: #22c55e;
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.08);
        }
        .app-item-badge.beta {
            color: #f59e0b;
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
        }
        .app-item-badge.coming {
            color: var(--sidebar-text-dim);
            border-color: var(--sidebar-border);
        }

        /* ===== AREA UTAMA ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            background: var(--main-bg);
            position: relative;
        }

        /* ----- HEADER / TOOLBAR (sama) ----- */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            min-height: 60px;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--paper-text);
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--paper-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 320px;
            letter-spacing: -0.2px;
        }
        .header-title .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 10px;
            vertical-align: middle;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #5a5a72;
            transition: background var(--transition), color var(--transition), transform 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--paper-text);
        }
        .btn-icon:active {
            transform: scale(0.92);
        }
        .btn-icon-primary:hover {
            background: rgba(79, 110, 247, 0.10);
            color: var(--accent);
        }

        .header-divider {
            width: 1px;
            height: 28px;
            background: var(--border-light);
            margin: 0 4px;
        }

        /* ----- PAPER WRAPPER (untuk konten utama) ----- */
        .paper-wrapper {
            flex: 1;
            min-height: 0;
            padding: 24px 32px 16px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ----- GRID APPS di area utama (mirip kartu) ----- */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding-bottom: 12px;
        }

        .app-card {
            background: var(--paper-bg);
            border-radius: var(--radius);
            padding: 20px 18px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: transform var(--transition), box-shadow var(--transition), border var(--transition);
            display: flex;
            flex-direction: column;
        }
        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }

        .app-card .card-icon {
            font-size: 28px;
            margin-bottom: 10px;
            width: 48px;
            height: 48px;
            background: var(--sidebar-bg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-light);
        }
        .app-card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--paper-text);
            letter-spacing: -0.2px;
        }
        .app-card p {
            font-size: 13px;
            color: var(--sidebar-text-dim);
            line-height: 1.5;
            margin-bottom: 14px;
            flex: 1;
        }
        .app-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            margin-top: auto;
        }
        .app-card .card-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 2px 10px;
            border-radius: 12px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-light);
            color: var(--sidebar-text-dim);
        }
        .app-card .card-badge.live {
            color: #22c55e;
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.08);
        }
        .app-card .card-badge.beta {
            color: #f59e0b;
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
        }
        .app-card .card-badge.coming {
            color: var(--sidebar-text-dim);
            border-color: var(--sidebar-border);
        }

        .btn-card {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            text-decoration: none;
            font-family: inherit;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-card:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px var(--accent-glow);
        }
        .btn-card:active {
            transform: scale(0.94);
        }
        .btn-card-outline {
            background: transparent;
            color: var(--accent);
            box-shadow: none;
            border: 1.5px solid var(--accent);
        }
        .btn-card-outline:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-card:disabled,
        .btn-card.disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* ----- FOOTER (sama) ----- */
        .main-footer {
            flex-shrink: 0;
            padding: 10px 28px 14px 28px;
            background: transparent;
            text-align: right;
            font-size: 12.5px;
            color: #9a9eb0;
            user-select: none;
            letter-spacing: 0.3px;
            font-weight: 400;
        }
        .main-footer span {
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* ===== SIDEBAR OVERLAY (mobile) ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ============================================================
                   RESPONSIVE (sama dengan note.html)
                   ============================================================ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                height: 100vh;
                width: 280px;
                min-width: 280px;
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.12);
                transition: transform var(--transition);
                z-index: 100;
                border-right: none;
                border-radius: 0 16px 16px 0;
                height: 100%;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger {
                display: flex;
            }
            .sidebar-overlay.active {
                display: block;
            }
            .main-header {
                padding: 10px 16px;
                min-height: 54px;
            }
            .paper-wrapper {
                padding: 12px 14px 8px 14px;
            }
            .apps-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 14px;
            }
            .header-title {
                max-width: 130px;
                font-size: 14px;
            }
            .header-title .dot {
                width: 6px;
                height: 6px;
                margin-right: 6px;
            }
            .main-footer {
                padding: 8px 16px 12px 16px;
                font-size: 11.5px;
            }
            .app-item {
                padding: 8px 12px;
            }
            .app-item-name {
                font-size: 13px;
            }
            .sidebar-header {
                padding: 18px 16px 12px 16px;
            }
            .sidebar-actions {
                padding: 10px 12px;
            }
            .btn-sidebar {
                font-size: 12px;
                padding: 8px 10px;
            }
        }

        @media (max-width: 450px) {
            .paper-wrapper {
                padding: 8px 8px 4px 8px;
            }
            .apps-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .main-header {
                padding: 6px 10px;
                min-height: 46px;
            }
            .btn-icon {
                padding: 5px 6px;
            }
            .header-title {
                max-width: 90px;
                font-size: 12.5px;
            }
            .header-left {
                gap: 8px;
            }
            .sidebar {
                width: 260px;
                min-width: 260px;
            }
            .sidebar-title {
                font-size: 15px;
            }
            .sidebar-logo {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }
            .app-card {
                padding: 14px 14px 14px;
            }
            .app-card p {
                font-size: 12.5px;
            }
        }

        /* ----- utility ----- */
        .hidden {
            display: none !important;
        }
        .empty-state {
            color: var(--sidebar-text-dim);
            font-size: 14px;
            text-align: center;
            padding: 40px 16px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- SIDEBAR OVERLAY (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">✦</div>
                <div class="sidebar-title">Muthinx <span>Apps</span></div>
            </div>

            <div class="sidebar-actions">
                <button class="btn-sidebar btn-sidebar-primary" id="refreshBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10" />
                        <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10" />
                    </svg>
                    Refresh
                </button>
                <button class="btn-sidebar" id="themeBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    Tema
                </button>
            </div>

            <div class="app-list-container" id="appListContainer">
                <!-- akan diisi JavaScript -->
            </div>
        </aside>

        <!-- ===== AREA UTAMA ===== -->
        <main class="main">
            <header class="main-header">
                <div class="header-left">
                    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <span class="header-title" id="headerTitle">
                        <span class="dot"></span>Semua Aplikasi
                    </span>
                </div>
                <div class="header-right">
                    <button class="btn-icon btn-icon-primary" id="searchBtn" title="Cari aplikasi (Ctrl+K)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                    </button>
                    <span class="header-divider"></span>
                    <button class="btn-icon" id="viewToggle" title="Ubah tampilan grid/list">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1" />
                            <rect x="14" y="3" width="7" height="7" rx="1" />
                            <rect x="3" y="14" width="7" height="7" rx="1" />
                            <rect x="14" y="14" width="7" height="7" rx="1" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="paper-wrapper" id="paperWrapper">
                <!-- grid aplikasi akan di-render di sini -->
                <div class="apps-grid" id="appsGrid"></div>
            </div>

            <footer class="main-footer">
                <span id="footerInfo">0 aplikasi</span>
            </footer>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DATA APLIKASI
            // ============================================================
            const appsData = [{
                id: 'notepad',
                icon: '📝',
                name: 'Notepad Transit',
                description: 'Catatan ringan dengan sidebar, riwayat undo/redo, upload .txt, dan statistik karakter.',
                status: 'live',
                link: 'note.html'
            }, {
                id: 'kalkulator',
                icon: '🧮',
                name: 'Kalkulator Cepat',
                description: 'Kalkulator sederhana dengan mode dark/light, riwayat perhitungan, dan dukungan keyboard.',
                status: 'beta',
                link: '#'
            }, {
                id: 'timer',
                icon: '⏳',
                name: 'Timer Fokus',
                description: 'Pomodoro timer dengan notifikasi, statistik sesi, dan tema yang dapat disesuaikan.',
                status: 'coming',
                link: '#'
            }, {
                id: 'clipboard',
                icon: '📋',
                name: 'Clipboard Manager',
                description: 'Kelola riwayat clipboard, simpan teks favorit, dan sinkronisasi antar perangkat.',
                status: 'coming',
                link: '#'
            }, {
                id: 'json',
                icon: '🔍',
                name: 'JSON Formatter',
                description: 'Validasi, format, dan perbaiki JSON dengan tampilan yang rapi dan error highlighting.',
                status: 'beta',
                link: '#'
            }, {
                id: 'color',
                icon: '🎨',
                name: 'Palette Studio',
                description: 'Generator palet warna dengan aksesibilitas, ekspor CSS, dan preview live.',
                status: 'coming',
                link: '#'
            }];

            // ============================================================
            // DOM REFS
            // ============================================================
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            const appListContainer = document.getElementById('appListContainer');
            const appsGrid = document.getElementById('appsGrid');
            const headerTitle = document.getElementById('headerTitle');
            const footerInfo = document.getElementById('footerInfo');
            const refreshBtn = document.getElementById('refreshBtn');
            const themeBtn = document.getElementById('themeBtn');
            const searchBtn = document.getElementById('searchBtn');
            const viewToggle = document.getElementById('viewToggle');

            let currentFilter = '';
            let currentView = 'grid'; // 'grid' atau 'list'

            // ============================================================
            // RENDER SIDEBAR (daftar aplikasi)
            // ============================================================
            function renderSidebar() {
                let html = '';
                appsData.forEach(app => {
                    const statusLabel = app.status === 'live' ? 'Live' :
                        app.status === 'beta' ? 'Beta' : 'Segera';
                    const statusClass = app.status === 'live' ? 'live' :
                        app.status === 'beta' ? 'beta' : 'coming';
                    html += `
                                <div class="app-item" data-id="${app.id}">
                                    <span class="app-item-icon">${app.icon}</span>
                                    <span class="app-item-name">${app.name}</span>
                                    <span class="app-item-badge ${statusClass}">${statusLabel}</span>
                                </div>
                            `;
                });
                appListContainer.innerHTML = html;

                // Klik item sidebar -> scroll ke kartu yang sesuai & highlight
                document.querySelectorAll('.app-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const card = document.querySelector(`.app-card[data-id="${id}"]`);
                        if (card) {
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            // highlight sementara
                            card.style.transition = 'box-shadow 0.3s';
                            card.style.boxShadow = '0 0 0 3px var(--accent)';
                            setTimeout(() => {
                                card.style.boxShadow = '';
                            }, 1200);
                        }
                        // tutup sidebar di mobile
                        if (window.innerWidth <= 768) toggleSidebar(false);
                    });
                });
            }

            // ============================================================
            // RENDER GRID (area utama)
            // ============================================================
            function renderGrid(filter = '') {
                const keyword = filter.toLowerCase().trim();
                let filtered = appsData;
                if (keyword) {
                    filtered = appsData.filter(app =>
                        app.name.toLowerCase().includes(keyword) ||
                        app.description.toLowerCase().includes(keyword) ||
                        app.status.includes(keyword)
                    );
                }

                // update footer
                footerInfo.textContent = `${filtered.length} aplikasi`;

                if (filtered.length === 0) {
                    appsGrid.innerHTML = `
                                <div class="empty-state" style="grid-column:1/-1;">
                                    Tidak ada aplikasi yang cocok dengan pencarian.
                                </div>
                            `;
                    return;
                }

                let html = '';
                filtered.forEach(app => {
                    const statusLabel = app.status === 'live' ? 'Live' :
                        app.status === 'beta' ? 'Beta' : 'Segera';
                    const statusClass = app.status === 'live' ? 'live' :
                        app.status === 'beta' ? 'beta' : 'coming';
                    const isDisabled = app.status === 'coming' || app.link === '#';
                    const btnClass = isDisabled ? 'btn-card btn-card-outline disabled' : 'btn-card';

                    html += `
                                <div class="app-card" data-id="${app.id}">
                                    <div class="card-icon">${app.icon}</div>
                                    <h3>${app.name}</h3>
                                    <p>${app.description}</p>
                                    <div class="card-footer">
                                        <span class="card-badge ${statusClass}">${statusLabel}</span>
                                        <a href="${app.link}" class="${btnClass}" ${isDisabled ? 'aria-disabled="true"' : ''}>
                                            ${isDisabled ? '⏳ Segera' : 'Buka →'}
                                        </a>
                                    </div>
                                </div>
                            `;
                });
                appsGrid.innerHTML = html;
            }

            // ============================================================
            // SIDEBAR TOGGLE (mobile)
            // ============================================================
            function toggleSidebar(open) {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('active', open);
                }
            }

            hamburger.addEventListener('click', function() {
                const isOpen = sidebar.classList.contains('open');
                toggleSidebar(!isOpen);
            });

            overlay.addEventListener('click', function() {
                toggleSidebar(false);
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });

            // ============================================================
            // TEMA (sama dengan note.html)
            // ============================================================
            function getStoredTheme() {
                return localStorage.getItem('muthinx-theme') || 'light';
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('muthinx-theme', theme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            }

            setTheme(getStoredTheme());

            themeBtn.addEventListener('click', toggleTheme);
            // juga bisa dengan tombol di header (jika ada)

            // ============================================================
            // SEARCH (popup sederhana)
            // ============================================================
            searchBtn.addEventListener('click', function() {
                const keyword = prompt('Cari aplikasi:', currentFilter);
                if (keyword !== null) {
                    currentFilter = keyword.trim();
                    renderGrid(currentFilter);
                    // update title
                    if (currentFilter) {
                        headerTitle.innerHTML = `<span class="dot"></span>Hasil: "${currentFilter}"`;
                    } else {
                        headerTitle.innerHTML = `<span class="dot"></span>Semua Aplikasi`;
                    }
                }
            });

            // Keyboard shortcut Ctrl+K
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    searchBtn.click();
                }
            });

            // ============================================================
            // VIEW TOGGLE (grid / list) - hanya untuk demonstrasi
            // ============================================================
            viewToggle.addEventListener('click', function() {
                if (currentView === 'grid') {
                    currentView = 'list';
                    appsGrid.style.display = 'flex';
                    appsGrid.style.flexDirection = 'column';
                    appsGrid.style.gap = '12px';
                    // ubah ikon
                    viewToggle.innerHTML = `
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="8" y1="6" x2="21" y2="6" />
                                    <line x1="8" y1="12" x2="21" y2="12" />
                                    <line x1="8" y1="18" x2="21" y2="18" />
                                    <line x1="3" y1="6" x2="3.01" y2="6" />
                                    <line x1="3" y1="12" x2="3.01" y2="12" />
                                    <line x1="3" y1="18" x2="3.01" y2="18" />
                                </svg>
                            `;
                } else {
                    currentView = 'grid';
                    appsGrid.style.display = 'grid';
                    appsGrid.style.flexDirection = '';
                    appsGrid.style.gap = '';
                    viewToggle.innerHTML = `
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7" rx="1" />
                                    <rect x="14" y="3" width="7" height="7" rx="1" />
                                    <rect x="3" y="14" width="7" height="7" rx="1" />
                                    <rect x="14" y="14" width="7" height="7" rx="1" />
                                </svg>
                            `;
                }
            });

            // ============================================================
            // REFRESH (reset filter & scroll ke atas)
            // ============================================================
            refreshBtn.addEventListener('click', function() {
                currentFilter = '';
                renderGrid('');
                headerTitle.innerHTML = `<span class="dot"></span>Semua Aplikasi`;
                document.getElementById('paperWrapper').scrollTop = 0;
                if (window.innerWidth <= 768) toggleSidebar(false);
            });

            // ============================================================
            // INISIALISASI
            // ============================================================
            renderSidebar();
            renderGrid('');
            headerTitle.innerHTML = `<span class="dot"></span>Semua Aplikasi`;

            // ============================================================
            // RESPONSIVE: saat klik di luar sidebar di mobile, tutup
            // ============================================================
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    const isSidebar = e.target.closest('.sidebar');
                    const isHamburger = e.target.closest('.hamburger');
                    if (!isSidebar && !isHamburger && sidebar.classList.contains('open')) {
                        toggleSidebar(false);
                    }
                }
            });

            console.log('🚀 Muthinx Apps Portal (dengan sidebar) siap!');
        })();
    </script>
</body>
</html>
