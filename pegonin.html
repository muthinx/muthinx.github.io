<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="description" content="Bismillah" />
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f6ef7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>" />
    <title>Pegonin - Transliterasi Latin ke Pegon</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           RESET & GLOBAL
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6;
            overflow: hidden;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --sidebar-bg: #f4f6fa;
            --sidebar-hover: #e9ecf2;
            --sidebar-active: #dde1e9;
            --sidebar-border: #dce0e8;
            --sidebar-text: #1a1a2e;
            --sidebar-text-dim: #6b7280;
            --accent: #4f6ef7;
            --accent-hover: #3a55d9;
            --accent-glow: rgba(79, 110, 247, 0.25);
            --main-bg: #f0f2f6;
            --paper-bg: #ffffff;
            --paper-text: #1a1a2e;
            --header-bg: rgba(255, 255, 255, 0.72);
            --border-light: #e6e9f0;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --toast-success: #22c55e;
            --toast-error: #ef4444;
        }

        [data-theme="dark"] {
            --sidebar-bg: #18182a;
            --sidebar-hover: #22223a;
            --sidebar-active: #2a2a48;
            --sidebar-border: #2a2a48;
            --sidebar-text: #f0f0f8;
            --sidebar-text-dim: #8a8ea0;
            --main-bg: #0f0f1a;
            --paper-bg: #1e1e32;
            --paper-text: #f0f0f8;
            --header-bg: rgba(20, 20, 40, 0.80);
            --border-light: #2a2a48;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.40);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.50);
            --accent: #6a84ff;
            --accent-hover: #5a74ef;
            --accent-glow: rgba(106, 132, 255, 0.30);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8ccd8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8aec0;
        }

        /* ============================================================
           APP LAYOUT
           ============================================================ */
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            transition: transform var(--transition), min-width var(--transition);
            z-index: 100;
            flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            position: relative;
        }

        .sidebar-header {
            padding: 22px 20px 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .sidebar-logo {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 16px var(--accent-glow);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-decoration: none;
        }

        .sidebar-logo:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 6px 24px var(--accent-glow);
            background: var(--accent-hover);
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--sidebar-text);
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .sidebar-title span {
            color: var(--accent);
        }

        /* ----- MENU NAVIGASI (2 menu) ----- */
        .sidebar-nav {
            padding: 14px 16px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-nav {
            display: flex;
            flex: 1;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.04);
            color: var(--sidebar-text);
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            width: 100%;
            justify-content: center;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .btn-nav:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .btn-nav:active {
            transform: scale(0.96);
        }
        .btn-nav.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-nav.active svg {
            opacity: 1;
        }
        .btn-nav svg {
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* ----- KONTEN SIDEBAR (riwayat) ----- */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 20px 10px;
            position: relative;
            z-index: 1;
        }

        .history-item-sidebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition);
            color: var(--sidebar-text);
            gap: 8px;
        }
        .history-item-sidebar:hover {
            background: var(--sidebar-hover);
        }
        .history-item-sidebar .h-name {
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item-sidebar .h-time {
            font-size: 11px;
            color: var(--sidebar-text-dim);
            flex-shrink: 0;
        }

        .sidebar-empty {
            color: var(--sidebar-text-dim);
            font-size: 13px;
            text-align: center;
            padding: 40px 16px;
            opacity: 0.6;
        }

        /* ----- FOOTER SIDEBAR (sosial media) ----- */
        .sidebar-footer {
            flex-shrink: 0;
            padding: 12px 16px 16px 16px;
            border-top: 1px solid var(--sidebar-border);
            display: flex;
            justify-content: center;
            gap: 14px;
        }
        .sidebar-footer a {
            color: var(--sidebar-text-dim);
            font-size: 20px;
            transition: color var(--transition), transform 0.15s;
            text-decoration: none;
        }
        .sidebar-footer a:hover {
            color: var(--accent);
            transform: translateY(-2px) scale(1.1);
        }

        /* ===== AREA UTAMA ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            background: var(--main-bg);
            position: relative;
        }

        /* ----- HEADER / TOOLBAR ----- */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            min-height: 60px;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--paper-text);
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--paper-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 320px;
            letter-spacing: -0.2px;
        }
        .header-title .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 10px;
            vertical-align: middle;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #5a5a72;
            transition: background var(--transition), color var(--transition), transform 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--paper-text);
        }
        .btn-icon:active {
            transform: scale(0.92);
        }
        .btn-icon-primary:hover {
            background: rgba(79, 110, 247, 0.10);
            color: var(--accent);
        }

        /* ----- PAPER WRAPPER (KONTEN UTAMA) ----- */
        .paper-wrapper {
            flex: 1;
            min-height: 0;
            padding: 24px 32px 16px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- KARTU KONVERTER (Pegonin) --- */
        .converter-card {
            background: var(--paper-bg);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: border var(--transition), box-shadow var(--transition);
        }
        .converter-card:hover {
            box-shadow: var(--shadow-md);
        }

        .converter-card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--paper-text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .converter-card .card-title i {
            color: var(--accent);
            font-size: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-row .input-field {
            flex: 1;
            min-width: 200px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-light);
            background: var(--main-bg);
            color: var(--paper-text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
            resize: vertical;
            min-height: 60px;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .input-field::placeholder {
            color: var(--sidebar-text-dim);
            opacity: 0.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            height: 44px;
        }
        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
        }
        .btn-outline:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-ghost {
            background: var(--sidebar-hover);
            color: var(--sidebar-text);
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover {
            background: var(--sidebar-active);
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }

        .btn-danger-ghost {
            background: transparent;
            color: var(--toast-error);
            border: 1px solid var(--toast-error);
        }
        .btn-danger-ghost:hover {
            background: var(--toast-error);
            color: #fff;
        }

        .btn-sm {
            height: 34px;
            padding: 4px 14px;
            font-size: 12px;
        }

        /* Hasil transliterasi */
        .result-box {
            margin-top: 16px;
            padding: 16px 18px;
            background: var(--main-bg);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--accent);
            display: none;
            flex-direction: column;
            gap: 12px;
			white-space: pre-wrap;
        }
        .result-box.visible {
            display: flex;
        }

        .result-box .result-text {
            font-size: 28px;
            font-family: 'Arabic Typesetting', 'Traditional Arabic', 'Arial', sans-serif;
            text-align: right;
            direction: rtl;
            word-break: break-all;
            color: var(--paper-text);
            background: var(--paper-bg);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            line-height: 1.6;
            min-height: 60px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .file-info {
            font-size: 13px;
            color: var(--sidebar-text-dim);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 6px 0 2px 0;
        }
        .file-info span {
            background: var(--paper-bg);
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }

        /* ----- RIWAYAT (di area utama) ----- */
        .history-list-main {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .history-item-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: var(--main-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            flex-wrap: wrap;
        }
        .history-item-main .h-left {
            flex: 1;
            min-width: 150px;
        }
        .history-item-main .h-left .h-original {
            font-size: 12px;
            color: var(--sidebar-text-dim);
            word-break: break-all;
        }
        .history-item-main .h-left .h-direct {
            font-size: 18px;
            font-family: 'Arabic Typesetting', 'Traditional Arabic', Arial;
            direction: rtl;
            text-align: right;
            color: var(--accent);
            word-break: break-all;
        }
        .history-item-main .h-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .history-empty {
            color: var(--sidebar-text-dim);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
            opacity: 0.6;
        }
        .history-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ----- TOAST NOTIFICATION ----- */
        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--paper-bg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            color: var(--paper-text);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .toast i {
            font-size: 18px;
        }
        .toast.success i {
            color: var(--toast-success);
        }
        .toast.error i {
            color: var(--toast-error);
        }
        .toast.info i {
            color: var(--accent);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- FOOTER (bawah main) ----- */
        .main-footer {
            flex-shrink: 0;
            padding: 10px 28px 14px 28px;
            background: transparent;
            text-align: right;
            font-size: 12.5px;
            color: #9a9eb0;
            user-select: none;
            letter-spacing: 0.3px;
            font-weight: 400;
        }
        .main-footer span {
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* ===== SIDEBAR OVERLAY (mobile) ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                height: 100vh;
                width: 280px;
                min-width: 280px;
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.12);
                transition: transform var(--transition);
                z-index: 100;
                border-right: none;
                border-radius: 0 16px 16px 0;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger {
                display: flex;
            }
            .sidebar-overlay.active {
                display: block;
            }
            .main-header {
                padding: 10px 16px;
                min-height: 54px;
            }
            .paper-wrapper {
                padding: 12px 14px 8px 14px;
                gap: 14px;
            }
            .header-title {
                max-width: 130px;
                font-size: 14px;
            }
            .header-title .dot {
                width: 6px;
                height: 6px;
                margin-right: 6px;
            }
            .main-footer {
                padding: 8px 16px 12px 16px;
                font-size: 11.5px;
            }
            .converter-card {
                padding: 16px 16px;
            }
            .input-row {
                flex-direction: column;
            }
            .input-row .input-field {
                min-width: unset;
            }
            .result-actions {
                flex-direction: column;
            }
            .result-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .toast-container {
                right: 12px;
                left: 12px;
                max-width: unset;
                bottom: 16px;
            }
        }

        @media (max-width: 450px) {
            .paper-wrapper {
                padding: 8px 8px 4px 8px;
                gap: 10px;
            }
            .main-header {
                padding: 6px 10px;
                min-height: 46px;
            }
            .btn-icon {
                padding: 5px 6px;
                font-size: 17px;
            }
            .header-title {
                max-width: 90px;
                font-size: 12.5px;
            }
            .header-left {
                gap: 8px;
            }
            .sidebar {
                width: 260px;
                min-width: 260px;
            }
            .converter-card {
                padding: 12px 12px;
            }
            .converter-card .card-title {
                font-size: 13px;
            }
            .btn {
                font-size: 12px;
                height: 38px;
                padding: 6px 14px;
            }
            .result-box .result-text {
                font-size: 22px;
            }
        }

        .hidden { display: none !important; }
        .mt-8 { margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app">
        <!-- SIDEBAR OVERLAY (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo" aria-label="Home">
                    <i class="fa-solid fa-house-chimney"></i>
                </a>
                <div class="sidebar-title">Pegon<span>In</span></div>
            </div>

            <!-- NAVIGASI 2 MENU -->
            <div class="sidebar-nav">
                <button class="btn-nav active" id="navConverter" data-view="converter">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                    Konverter
                </button>
                <button class="btn-nav" id="navHistory" data-view="history">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    Riwayat
                </button>
            </div>

            <!-- KONTEN SIDEBAR (riwayat) -->
            <div class="sidebar-content" id="sidebarContent">
                <div class="sidebar-empty">Riwayat transliterasi<br/>akan muncul di sini</div>
            </div>

            <!-- FOOTER SIDEBAR (sosial media) -->
            <div class="sidebar-footer">
                <a href="#" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" target="_blank" aria-label="Tiktok"><i class="fab fa-tiktok"></i></a>
                <a href="#" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </aside>

        <!-- ===== AREA UTAMA ===== -->
        <main class="main">
            <header class="main-header">
                <div class="header-left">
                    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="header-title" id="headerTitle">
                        <span class="dot"></span>Konverter
                    </span>
                </div>
                <div class="header-right">
                    <button class="btn-icon btn-icon-primary" id="themeToggle" aria-label="Toggle tema">
                        <i class="fas fa-sun" id="themeIcon"></i>
                    </button>
                </div>
            </header>

            <div class="paper-wrapper" id="paperWrapper">
                <!-- VIEW KONVERTER -->
                <div id="viewConverter">
                    <div class="converter-card">
                        <div class="card-title">
                            <i class="fa-solid fa-arrow-right-arrow-left"></i>
                            Transliterasi Latin → Pegon
                        </div>

                        <div class="input-group">
                            <div class="input-row">
                                <div class="input-field">
                                    <textarea class="input-field" id="inputText" placeholder="Masukkan teks Latin di sini…&#10;Contoh: belajar makan tempe"></textarea>
                                </div>
                            </div>
                            <div class="input-row">
                                <button class="btn btn-ghost" id="pasteBtn"><i class="fas fa-paste"></i> Paste</button>
                                <button class="btn btn-primary" id="transliterateBtn"><i class="fas fa-arrow-right"></i> Transliterasi</button>
                                <button class="btn btn-ghost" id="resetBtn"><i class="fas fa-eraser"></i> Reset</button>
                            </div>
                        </div>

                        <!-- Hasil -->
                        <div class="result-box" id="resultBox">
                            <div class="file-info">
                                <span><i class="far fa-file"></i> Hasil transliterasi</span>
                            </div>
                            <div class="result-text" id="resultText" dir="rtl">-</div>
                            <div class="result-actions">
                                <button class="btn btn-outline btn-sm" id="copyBtn"><i class="fas fa-copy"></i> Salin</button>
                                <button class="btn btn-success btn-sm" id="saveBtn"><i class="fas fa-save"></i> Simpan</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- VIEW RIWAYAT -->
                <div id="viewHistory" class="hidden">
                    <div class="converter-card">
                        <div class="card-title">
                            <i class="fas fa-clock-rotate-left"></i>
                            Riwayat Transliterasi
                        </div>
                        <div class="history-header-main">
                            <span style="font-size:13px; color:var(--sidebar-text-dim);" id="historyCountMain">0 item</span>
                            <div style="display:flex; gap:8px;">
                                <button class="btn btn-ghost btn-sm" id="clearHistoryBtnMain"><i class="fas fa-trash-can"></i> Hapus Semua</button>
                            </div>
                        </div>
                        <div class="history-list-main" id="historyListMain">
                            <div class="history-empty">Belum ada riwayat transliterasi.</div>
                        </div>
                    </div>
                </div>
            </div>

                <span id="footerInfo">Pegonin v1.0 · © Uiscript</span>
            </footer>
        </main>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM REFS
            // ============================================================
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const headerTitle = document.getElementById('headerTitle');

            const navConverter = document.getElementById('navConverter');
            const navHistory = document.getElementById('navHistory');
            const viewConverter = document.getElementById('viewConverter');
            const viewHistory = document.getElementById('viewHistory');

            const inputText = document.getElementById('inputText');
            const transliterateBtn = document.getElementById('transliterateBtn');
            const pasteBtn = document.getElementById('pasteBtn');
            const resetBtn = document.getElementById('resetBtn');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const copyBtn = document.getElementById('copyBtn');
            const saveBtn = document.getElementById('saveBtn');

            const historyListMain = document.getElementById('historyListMain');
            const historyCountMain = document.getElementById('historyCountMain');
            const clearHistoryBtnMain = document.getElementById('clearHistoryBtnMain');

            const toastContainer = document.getElementById('toastContainer');

            const STORAGE_KEY = 'pegonin_history'; // Diganti dari arabin_history ke pegonin

            // ============================================================
            // TEMA
            // ============================================================
            function getStoredTheme() {
                return localStorage.getItem('pegonin-theme') || 'light';
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('pegonin-theme', theme);
                themeIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            }

            setTheme(getStoredTheme());
            themeToggle.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // ============================================================
            // SIDEBAR TOGGLE (mobile)
            // ============================================================
            function toggleSidebar(open) {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('active', open);
                }
            }

            hamburger.addEventListener('click', function() {
                toggleSidebar(!sidebar.classList.contains('open'));
            });
            overlay.addEventListener('click', function() {
                toggleSidebar(false);
            });
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    const isSidebar = e.target.closest('.sidebar');
                    const isHamburger = e.target.closest('.hamburger');
                    if (!isSidebar && !isHamburger && sidebar.classList.contains('open')) {
                        toggleSidebar(false);
                    }
                }
            });

            // ============================================================
            // TOAST
            // ============================================================
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const iconMap = {
                    success: 'fa-circle-check',
                    error: 'fa-circle-xmark',
                    info: 'fa-circle-info'
                };
                toast.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'opacity 0.3s, transform 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            // ============================================================
            // DATA & FUNGSI TRANSLITERASI (HYBRID APPROACH)
            // ============================================================
            
            // 1. Kamus Object untuk kata utuh (O(1) Lookup)
            const kamusPegon = {
                "belajar": "بلاجار",
                "tempe": "تيمڤي",
                "bersender": "برسيندير",
                "allah": "الله",
				"alloh": "الله",
                "muhammad": "محمد"
            };

            // 2. Daftar Transliterasi per huruf
			const replacements = [
				// 1. DIGRAF KONSENAN (Harus di paling atas)
				{ pattern: 'ny', replacement: 'ۑ' },
				{ pattern: 'ng', replacement: 'ڠ' },
				{ pattern: 'kh', replacement: 'خ' },
				{ pattern: 'sy', replacement: 'ش' },
				{ pattern: 'gh', replacement: 'غ' },

				// 2. VOKAL DI AWAL KATA (\b = batas awal kata)
				{ pattern: '\bi', replacement: 'اي' },
				{ pattern: '\bu', replacement: 'او' },
				{ pattern: '\ba', replacement: 'ا' },
				{ pattern: '\bo', replacement: 'او' },
				{ pattern: '\be', replacement: 'اي' },

				// 3. HURUF KONSONAN & VOKAL TUNGGAL
				{ pattern: 'a', replacement: 'ا' },
				{ pattern: 'b', replacement: 'ب' },
				{ pattern: 'c', replacement: 'چ' },
				{ pattern: 'd', replacement: 'د' },
				{ pattern: 'e', replacement: 'ي' },
				{ pattern: 'E', replacement: 'ٓ' }, // Pepet
				{ pattern: 'f', replacement: 'ف' },
				{ pattern: 'g', replacement: 'ڮ' },
				{ pattern: 'h', replacement: 'ه' },
				{ pattern: 'i', replacement: 'ي' },
				{ pattern: 'j', replacement: 'ج' },
				{ pattern: 'k', replacement: 'ك' },
				{ pattern: 'l', replacement: 'ل' },
				{ pattern: 'm', replacement: 'م' },
				{ pattern: 'n', replacement: 'ن' },
				{ pattern: 'o', replacement: 'و' },
				{ pattern: 'p', replacement: 'ڤ' },
				{ pattern: 'q', replacement: 'ق' },
				{ pattern: 'r', replacement: 'ر' },
				{ pattern: 's', replacement: 'س' },
				{ pattern: 't', replacement: 'ت' },
				{ pattern: 'u', replacement: 'و' },
				{ pattern: 'v', replacement: 'ف' },
				{ pattern: 'w', replacement: 'و' },
				{ pattern: 'x', replacement: 'كس' },
				{ pattern: 'y', replacement: 'ي' },
				{ pattern: 'z', replacement: 'ز' },

				// 4. TANDA BACA ARAB
				{ pattern: ',', replacement: '،' },
				{ pattern: '\\?', replacement: '؟' },
				{ pattern: ';', replacement: '؛' }
			];

            function transliterate(text) {
                if (!text) return '';
                
                // --- Langkah 1: Pengecekan Kata Utuh dengan Kamus Object ---
                // Regex \b[a-zA-Z]+\b mengekstrak satu kata utuh, lalu dicek ke kamusPegon
                let result = text.replace(/\b[a-zA-Z]+\b/g, function(match) {
                    let kataKecil = match.toLowerCase();
                    if (kamusPegon[kataKecil]) {
                        return kamusPegon[kataKecil];
                    }
                    return match; // kembalikan kata asli jika tidak ada di kamus
                });

                // --- Langkah 2: Transliterasi per huruf sisanya ---
                const sorted = [...replacements].sort((a, b) => b.pattern.length - a.pattern.length);
                for (const item of sorted) {
                    const escaped = item.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'g');
                    result = result.replace(regex, item.replacement);
                }
                
                return result;
            }

            function performTransliteration(autoSave = true) {
                const raw = inputText.value.trim();
                if (!raw) {
                    showToast('Teks input tidak boleh kosong.', 'error');
                    resultBox.classList.remove('visible');
                    return;
                }

                const result = transliterate(raw);
                resultText.textContent = result;
                resultBox.classList.add('visible');
            }

            // ============================================================
            // RIWAYAT (localStorage) 
            // ============================================================
            function getHistory() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                } catch (_) {
                    return [];
                }
            }

            function saveHistoryEntry(original, result) {
                const history = getHistory();
                const entry = {
                    original,
                    result,
                    timestamp: Date.now()
                };
                const exists = history.some(h => h.result === result && h.original === original);
                if (!exists) {
                    history.unshift(entry);
                    if (history.length > 50) history.pop();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                    renderAllHistory();
                    showToast('Berhasil disimpan ke riwayat.', 'success');
                } else {
                    showToast('Data sudah ada di riwayat.', 'info');
                }
            }

            function deleteHistoryItem(index) {
                const history = getHistory();
                if (index >= 0 && index < history.length) {
                    history.splice(index, 1);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                    renderAllHistory();
                    showToast('Riwayat dihapus.', 'info');
                }
            }

            function clearAllHistory() {
                if (getHistory().length === 0) {
                    showToast('Riwayat sudah kosong.', 'info');
                    return;
                }
                if (confirm('Hapus semua riwayat transliterasi?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    renderAllHistory();
                    showToast('Semua riwayat dihapus.', 'success');
                }
            }

            function renderAllHistory() {
                renderHistoryMain();
                renderHistorySidebar();
            }

            function renderHistoryMain() {
                const history = getHistory();
                historyCountMain.textContent = `${history.length} item`;

                if (history.length === 0) {
                    historyListMain.innerHTML = `<div class="history-empty">Belum ada riwayat transliterasi.</div>`;
                    return;
                }

                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', {
                        hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short', year: 'numeric'
                    });
                    html += `
                        <div class="history-item-main">
                            <div class="h-left">
                                <div class="h-original"><i class="fas fa-font"></i> ${item.original.substring(0, 60)}${item.original.length > 60 ? '…' : ''}</div>
                                <div class="h-direct">${item.result.substring(0, 60)}${item.result.length > 60 ? '…' : ''}</div>
                                <div style="font-size:11px;color:var(--sidebar-text-dim);margin-top:4px;">${time}</div>
                            </div>
                            <div class="h-actions">
                                <button class="btn btn-outline btn-sm" onclick="copyText('${item.result}')"><i class="fas fa-copy"></i></button>
                                <button class="btn btn-danger-ghost btn-sm" onclick="deleteHistoryItem(${index})"><i class="fas fa-trash-can"></i></button>
                            </div>
                        </div>
                    `;
                });
                historyListMain.innerHTML = html;
            }

            function renderHistorySidebar() {
                const history = getHistory();
                const sidebarContent = document.getElementById('sidebarContent');
                if (history.length === 0) {
                    sidebarContent.innerHTML = `<div class="sidebar-empty">Riwayat transliterasi<br/>akan muncul di sini</div>`;
                    return;
                }

                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', {
                        hour: '2-digit', minute: '2-digit'
                    });
                    html += `
                        <div class="history-item-sidebar" onclick="loadHistoryItem(${index})">
                            <span class="h-name">${item.original.substring(0, 20)}…</span>
                            <span class="h-time">${time}</span>
                        </div>
                    `;
                });
                sidebarContent.innerHTML = html;
            }

            window.loadHistoryItem = function(index) {
                const history = getHistory();
                if (history[index]) {
                    inputText.value = history[index].original;
                    performTransliteration(false);
                    if (window.innerWidth <= 768) toggleSidebar(false);
                }
            };

            window.deleteHistoryItem = deleteHistoryItem;
            window.copyText = function(text) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('Teks disalin ke clipboard! 📋', 'success');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            };

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('Teks disalin ke clipboard! 📋', 'success');
                } catch (_) {
                    showToast('Gagal menyalin.', 'error');
                }
                document.body.removeChild(ta);
            }

            // ============================================================
            // TOMBOL SIMPAN
            // ============================================================
            function handleSave() {
                const raw = inputText.value.trim();
                const result = resultText.textContent;
                if (!raw || !result || result === '-') {
                    showToast('Tidak ada hasil untuk disimpan.', 'error');
                    return;
                }
                saveHistoryEntry(raw, result);
            }

            // ============================================================
            // SWITCH VIEW (Konverter / Riwayat)
            // ============================================================
            function switchView(view) {
                if (view === 'converter') {
                    viewConverter.classList.remove('hidden');
                    viewHistory.classList.add('hidden');
                    navConverter.classList.add('active');
                    navHistory.classList.remove('active');
                    headerTitle.innerHTML = `<span class="dot"></span>Konverter`;
                } else {
                    viewConverter.classList.add('hidden');
                    viewHistory.classList.remove('hidden');
                    navHistory.classList.add('active');
                    navConverter.classList.remove('active');
                    headerTitle.innerHTML = `<span class="dot"></span>Riwayat`;
                    renderHistoryMain();
                }
                if (window.innerWidth <= 768) toggleSidebar(false);
            }

            navConverter.addEventListener('click', () => switchView('converter'));
            navHistory.addEventListener('click', () => switchView('history'));

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            transliterateBtn.addEventListener('click', () => performTransliteration(false));
            saveBtn.addEventListener('click', handleSave);
            
            inputText.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    performTransliteration(false);
                }
            });

            pasteBtn.addEventListener('click', async function() {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        inputText.value = text;
                        showToast('Teks ditempel dari clipboard.', 'info');
                    }
                } catch (_) {
                    showToast('Gagal mengakses clipboard. Tempel manual (Ctrl+V).', 'error');
                }
            });

            resetBtn.addEventListener('click', function() {
                inputText.value = '';
                resultBox.classList.remove('visible');
                showToast('Input dibersihkan.', 'info');
            });

            copyBtn.addEventListener('click', function() {
                const text = resultText.textContent;
                if (text && text !== '-') {
                    window.copyText(text);
                } else {
                    showToast('Tidak ada teks untuk disalin.', 'error');
                }
            });

            clearHistoryBtnMain.addEventListener('click', clearAllHistory);

            // ============================================================
            // INISIALISASI
            // ============================================================
            renderAllHistory();
            switchView('converter');

            const socialLinks = document.querySelectorAll('.sidebar-footer a');
            if (socialLinks.length >= 4) {
                socialLinks[0].href = 'https://instagram.com/salimmuthinx';
                socialLinks[1].href = 'https://facebook.com/muthinx';
                socialLinks[2].href = 'https://tiktok.com/@bengkel.kangacul';
                socialLinks[3].href = 'https://github.com/muthinx';
            }

            console.log('🕌 Pegonin web app siap (dengan Hybrid Engine)');
            console.log('📂 Riwayat:', getHistory().length, 'item');

        })();
    </script>
