<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Bismillah" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f6ef7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>" />
    <title>Pegonin - Transliterasi Latin ke Pegon</title>
    <style>
        /* ============================================================
           RESET & GLOBAL (SAMA PERSIS note.html)
           ============================================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6; overflow: hidden; color: #1a1a2e;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --sidebar-bg: #f4f6fa;
            --sidebar-hover: #e9ecf2;
            --sidebar-active: #dde1e9;
            --sidebar-border: #dce0e8;
            --sidebar-text: #1a1a2e;
            --sidebar-text-dim: #6b7280;
            --accent: #4f6ef7;
            --accent-hover: #3a55d9;
            --accent-glow: rgba(79, 110, 247, 0.25);
            --main-bg: #f0f2f6;
            --paper-bg: #ffffff;
            --paper-text: #1a1a2e;
            --header-bg: rgba(255, 255, 255, 0.72);
            --border-light: #e6e9f0;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --toast-success: #22c55e;
            --toast-error: #ef4444;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c8ccd8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8aec0; }

        /* ===== LAYOUT ===== */
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px; min-width: 280px;
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            height: 100%; overflow: hidden;
            transition: transform var(--transition), min-width var(--transition);
            z-index: 100; flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            position: relative;
        }

        .sidebar-header {
            padding: 22px 20px 14px 20px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0; position: relative; z-index: 1;
        }

        .sidebar-logo {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            background: var(--accent); border-radius: var(--radius-sm);
            color: white;
            box-shadow: 0 4px 16px var(--accent-glow);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-decoration: none;
        }
        .sidebar-logo svg { width: 20px; height: 20px; }
        .sidebar-logo:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 6px 24px var(--accent-glow);
            background: var(--accent-hover);
        }

        .sidebar-title {
            font-size: 17px; font-weight: 600;
            color: var(--sidebar-text);
            letter-spacing: -0.2px; white-space: nowrap;
        }
        .sidebar-title span { color: var(--accent); }

        /* ----- SIDEBAR ACTIONS ----- */
        .sidebar-actions {
            padding: 14px 16px;
            display: flex; flex-direction: row; gap: 8px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0; position: relative; z-index: 1;
        }

        .btn-sidebar {
            display: flex; flex: 1; align-items: center; gap: 8px;
            padding: 9px 12px; border: none;
            border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.04);
            color: var(--sidebar-text);
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            width: 100%; justify-content: center;
            font-family: inherit; letter-spacing: 0.2px;
        }
        .btn-sidebar:hover { background: rgba(0, 0, 0, 0.08); }
        .btn-sidebar:active { transform: scale(0.96); }
        .btn-sidebar svg { flex-shrink: 0; opacity: 0.7; }

        .btn-sidebar-primary {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-sidebar-primary:hover {
            background: var(--accent-hover); color: #fff;
            box-shadow: 0 6px 24px var(--accent-glow);
        }
        .btn-sidebar-primary svg { opacity: 1; }

        /* ----- DAFTAR RIWAYAT DI SIDEBAR ----- */
        .file-list-container {
            flex: 1; overflow-y: auto;
            padding: 8px 10px 20px 10px;
            position: relative; z-index: 1;
        }
        .file-list-container::-webkit-scrollbar { width: 4px; }
        .file-list-container::-webkit-scrollbar-thumb { background: #c8ccd8; border-radius: 10px; }

        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), transform 0.12s;
            position: relative;
            color: var(--sidebar-text); gap: 8px;
        }
        .file-item:hover { background: var(--sidebar-hover); }
        .file-item.active {
            background: var(--sidebar-active);
            box-shadow: inset 3px 0 0 var(--accent);
            font-weight: 500;
        }
        .file-item-name {
            font-size: 14px; flex: 1;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; padding-right: 4px;
            letter-spacing: 0.1px;
        }
        .file-item-menu {
            flex-shrink: 0; background: none; border: none;
            cursor: pointer; padding: 4px 6px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: var(--sidebar-text-dim);
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        .file-item-menu:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--sidebar-text);
        }

        .file-list-empty {
            color: var(--sidebar-text-dim); font-size: 13px;
            text-align: center; padding: 40px 16px; opacity: 0.6;
        }

        /* ----- DROPDOWN ----- */
        .dropdown {
            position: absolute; right: 0; top: 110%;
            background: #ffffff; border-radius: var(--radius);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            min-width: 190px; padding: 6px 0;
            display: none; z-index: 200;
            animation: dropFade 0.18s ease-out;
            border: 1px solid var(--sidebar-border);
        }
        .dropdown.open { display: block; }
        @keyframes dropFade {
            from { opacity: 0; transform: scale(0.94) translateY(-8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 16px; font-size: 13px;
            color: var(--sidebar-text);
            border: none; background: none; width: 100%;
            text-align: left; cursor: pointer;
            transition: background 0.12s; border-radius: 0;
            font-family: inherit; letter-spacing: 0.1px;
        }
        .dropdown-item:hover { background: var(--sidebar-hover); }
        .dropdown-item:first-child { border-radius: var(--radius) var(--radius) 0 0; }
        .dropdown-item:last-child  { border-radius: 0 0 var(--radius) var(--radius); }
        .dropdown-item.danger { color: #dc2626; }
        .dropdown-item.danger:hover { background: #fde8e8; }
        .dropdown-item svg { flex-shrink: 0; opacity: 0.7; }

        /* ----- FOOTER SIDEBAR ----- */
        .sidebar-footer {
            flex-shrink: 0; padding: 12px 16px 16px 16px;
            border-top: 1px solid var(--sidebar-border);
            display: flex; justify-content: center; gap: 14px;
        }
        .sidebar-footer a {
            color: var(--sidebar-text-dim);
            transition: color var(--transition), transform 0.15s;
            text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .sidebar-footer a svg { width: 20px; height: 20px; }
        .sidebar-footer a:hover { color: var(--accent); transform: translateY(-2px) scale(1.1); }

        /* ===== MAIN ===== */
        .main {
            flex: 1; display: flex; flex-direction: column;
            height: 100%; min-width: 0;
            background: var(--main-bg);
            position: relative;
        }

        /* ----- HEADER ----- */
        .main-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 28px;
            background: var(--header-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0; min-height: 60px; gap: 12px;
            position: sticky; top: 0; z-index: 10;
        }
        .header-left {
            display: flex; align-items: center; gap: 14px; min-width: 0;
        }
        .hamburger {
            display: none; background: none; border: none;
            cursor: pointer; padding: 6px;
            color: var(--paper-text);
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover { background: rgba(0, 0, 0, 0.05); }

        .file-name-display {
            font-size: 16px; font-weight: 500;
            color: var(--paper-text);
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; max-width: 320px;
            letter-spacing: -0.2px;
        }
        .file-name-display .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: var(--accent);
            margin-right: 10px; vertical-align: middle;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .header-right {
            display: flex; align-items: center; gap: 2px; flex-shrink: 0;
        }
        .btn-icon {
            background: none; border: none;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #5a5a72;
            transition: background var(--transition), color var(--transition), transform 0.12s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon svg { width: 20px; height: 20px; }
        .btn-icon:hover { background: rgba(0, 0, 0, 0.05); color: var(--paper-text); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon-primary:hover {
            background: rgba(79, 110, 247, 0.10);
            color: var(--accent);
        }

        /* ----- PAPER WRAPPER ----- */
        .paper-wrapper {
            flex: 1; min-height: 0;
            padding: 24px 32px 16px 32px;
            overflow-y: auto;
            display: flex; flex-direction: column;
            gap: 18px;
        }

        /* ----- PAPER CARD ----- */
        .paper-card {
            background: var(--paper-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 26px 30px;
            transition: box-shadow var(--transition);
        }
        .paper-card:focus-within {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(79, 110, 247, 0.15);
        }

        .paper-card .card-title {
            font-size: 15px; font-weight: 600;
            color: var(--paper-text);
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 10px;
            letter-spacing: -0.2px;
        }
        .paper-card .card-title svg { color: var(--accent); }

        /* ----- INPUT TEXTAREA ----- */
        .paper-input {
            width: 100%; padding: 14px 16px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm);
            background: #f8f9fc;
            color: var(--paper-text);
            font-family: inherit; font-size: 14.5px;
            line-height: 1.6; outline: none;
            resize: vertical; min-height: 90px;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            letter-spacing: 0.1px;
        }
        .paper-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: #fff;
        }
        .paper-input::placeholder { color: #b0b4c8; font-weight: 350; letter-spacing: 0.2px; }

        /* ----- TOMBOL ----- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-weight: 500; font-size: 13px;
            border: none; cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            font-family: inherit; white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn:active { transform: scale(0.96); }
        .btn svg { width: 15px; height: 15px; }

        .btn-primary {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .btn-ghost {
            background: #f0f2f6; color: var(--sidebar-text);
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover { background: #e4e7ee; }

        .btn-outline {
            background: transparent; color: var(--accent);
            border: 1.5px solid var(--accent);
        }
        .btn-outline:hover {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-success {
            background: #22c55e; color: #fff;
            border: 1.5px solid #22c55e;
        }
        .btn-success:hover {
            background: #16a34a; border-color: #16a34a;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.30);
        }

        .btn-danger-ghost {
            background: transparent; color: #dc2626;
            border: 1.5px solid #dc2626;
        }
        .btn-danger-ghost:hover { background: #dc2626; color: #fff; }

        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-sm svg { width: 13px; height: 13px; }

        .input-actions {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
        }

        /* ----- HASIL TRANSLITERASI ----- */
        .result-box {
            margin-top: 18px;
            padding: 16px 18px;
            background: #f8f9fc;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--accent);
            display: none;
            flex-direction: column; gap: 12px;
        }
        .result-box.visible { display: flex; }

        .file-info {
            font-size: 13px; color: var(--sidebar-text-dim);
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .file-info span {
            background: #ffffff; padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            display: inline-flex; align-items: center; gap: 6px;
        }

        .result-text {
            font-size: 28px;
            font-family: 'Arabic Typesetting', 'Traditional Arabic', 'Amiri', 'Arial', sans-serif;
            text-align: right;
            direction: rtl;
            word-break: break-word;
            color: var(--paper-text);
            background: #ffffff;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            line-height: 1.8;
            min-height: 70px;
            white-space: pre-wrap;
        }

        /* ----- RIWAYAT DI MAIN ----- */
        .history-header-main {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 14px;
            flex-wrap: wrap; gap: 8px;
        }
        .history-header-main .count-label {
            font-size: 13px; color: var(--sidebar-text-dim);
        }
        .history-list-main {
            display: flex; flex-direction: column; gap: 10px;
        }
        .history-item-main {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 14px;
            background: #f8f9fc;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            flex-wrap: wrap;
        }
        .history-item-main .h-left { flex: 1; min-width: 150px; }
        .history-item-main .h-left .h-original {
            font-size: 12.5px; color: var(--sidebar-text-dim);
            word-break: break-all; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .history-item-main .h-left .h-arabic {
            font-size: 22px;
            font-family: 'Arabic Typesetting', 'Traditional Arabic', 'Amiri', Arial;
            direction: rtl;
            text-align: right;
            color: var(--paper-text);
            word-break: break-word;
            line-height: 1.7;
            margin-bottom: 6px;
        }
        .history-item-main .h-left .h-meta {
            font-size: 11px; color: var(--sidebar-text-dim);
        }
        .history-item-main .h-actions {
            display: flex; gap: 6px; flex-shrink: 0;
        }
        .history-empty {
            color: var(--sidebar-text-dim); font-size: 13px;
            text-align: center; padding: 30px 0; opacity: 0.6;
        }

        /* ----- FOOTER ----- */
        .main-footer {
            flex-shrink: 0; padding: 10px 28px 14px 28px;
            background: transparent; text-align: right;
            font-size: 12.5px; color: #9a9eb0;
            user-select: none; letter-spacing: 0.3px; font-weight: 400;
        }
        .main-footer span {
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            padding: 4px 14px; border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* ----- TOAST ----- */
        .toast-container {
            position: fixed; bottom: 28px; right: 28px;
            z-index: 999; display: flex; flex-direction: column;
            gap: 10px; max-width: 380px; width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 13px 18px;
            border-radius: var(--radius-sm);
            background: #fff; border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            color: var(--paper-text); font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
            pointer-events: auto;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .toast svg { flex-shrink: 0; }
        .toast.success svg { color: var(--toast-success); }
        .toast.error svg   { color: var(--toast-error); }
        .toast.info svg    { color: var(--accent); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ----- MODAL ----- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #ffffff; max-width: 420px; width: 90%;
            padding: 32px 36px 28px 36px;
            border-radius: var(--radius);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.20);
            text-align: center;
            animation: modalSlide 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h3 {
            font-weight: 600; font-size: 20px;
            margin-bottom: 8px; color: var(--paper-text);
            letter-spacing: -0.3px;
        }
        .modal-box p {
            color: #5a5a72; font-size: 15px;
            margin-bottom: 24px; line-height: 1.6;
        }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-actions .btn { min-width: 100px; padding: 10px 0; font-size: 14px; }
        .btn-modal-cancel { background: #f0f2f6; color: var(--paper-text); }
        .btn-modal-cancel:hover { background: #e4e7ee; }
        .btn-modal-danger { background: #dc2626; color: white; }
        .btn-modal-danger:hover { background: #b91c1c; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.30); }
        .btn-modal-primary { background: var(--accent); color: white; }
        .btn-modal-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 16px var(--accent-glow); }

        /* ----- SIDEBAR OVERLAY ----- */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px); z-index: 99;
        }
        .sidebar-overlay.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; left: 0;
                transform: translateX(-100%);
                height: 100vh; width: 280px; min-width: 280px;
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.12);
                transition: transform var(--transition);
                z-index: 100; border-right: none;
                border-radius: 0 16px 16px 0;
            }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: flex; }
            .sidebar-overlay.active { display: block; }
            .main-header { padding: 10px 16px; min-height: 54px; }
            .paper-wrapper { padding: 12px 14px 8px 14px; gap: 12px; }
            .paper-card { padding: 18px 18px; }
            .file-name-display { max-width: 130px; font-size: 14px; }
            .file-name-display .dot { width: 6px; height: 6px; margin-right: 6px; }
            .main-footer { padding: 8px 16px 12px 16px; font-size: 11.5px; }
            .sidebar-header { padding: 18px 16px 12px 16px; }
            .sidebar-actions { padding: 10px 12px; }
            .btn-sidebar { font-size: 12px; padding: 8px 10px; }
            .file-list-container { padding: 4px 6px 16px 6px; }
            .file-item { padding: 8px 12px; }
            .file-item-name { font-size: 13px; }
            .toast-container { right: 12px; left: 12px; max-width: unset; bottom: 16px; }
            .input-actions { flex-direction: column; }
            .input-actions .btn { width: 100%; }
            .result-text { font-size: 22px; padding: 12px 14px; }
            .history-item-main { flex-direction: column; align-items: stretch; }
            .history-item-main .h-actions { justify-content: flex-end; }
            .history-item-main .h-left .h-arabic { font-size: 18px; }
        }

        @media (max-width: 450px) {
            .paper-wrapper { padding: 8px 8px 4px 8px; }
            .paper-card { padding: 14px 14px; }
            .main-header { padding: 6px 10px; min-height: 46px; }

            .sidebar-logo { width: 30px; height: 30px; }
            .modal-box { padding: 20px 14px 16px 14px; width: 95%; }
            .result-text { font-size: 18px; }
        }

        .hidden { display: none !important; }
    </style>
</head>

    <script>
        (function() {
            'use strict';

            // ===== DOM REFS =====
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            const themeToggle = document.getElementById('themeToggle');
            const headerTitle = document.getElementById('headerTitle');

            const navConverter = document.getElementById('navConverter');
            const navHistory = document.getElementById('navHistory');
            const viewConverter = document.getElementById('viewConverter');
            const viewHistory = document.getElementById('viewHistory');
            const sidebarContent = document.getElementById('sidebarContent');

            const inputText = document.getElementById('inputText');
            const transliterateBtn = document.getElementById('transliterateBtn');
            const pasteBtn = document.getElementById('pasteBtn');
            const resetBtn = document.getElementById('resetBtn');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const copyBtn = document.getElementById('copyBtn');
            const saveBtn = document.getElementById('saveBtn');

            const historyListMain = document.getElementById('historyListMain');
            const historyCountMain = document.getElementById('historyCountMain');
            const clearHistoryBtnMain = document.getElementById('clearHistoryBtnMain');

            const toastContainer = document.getElementById('toastContainer');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');

            const STORAGE_KEY = 'pegonin_history';

            // ===== ICON SVG =====
            const sunSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
            const moonSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
            const checkSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 10"/></svg>`;
            const errSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
            const infoSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
            const emptyFolderSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;display:block;margin:0 auto 10px auto;opacity:0.4;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;

            // ===== TEMA (sinkron dengan portal — pakai key muthinx-theme) =====
            function getStoredTheme() {
                return localStorage.getItem('muthinx-theme') || 'light';
            }
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('muthinx-theme', theme);
                themeToggle.innerHTML = theme === 'dark' ? moonSvg : sunSvg;
            }
            setTheme(getStoredTheme());
            themeToggle.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // ===== SIDEBAR =====
            function toggleSidebar(open) {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('active', open);
                }
            }
            hamburger.addEventListener('click', function() {
                toggleSidebar(!sidebar.classList.contains('open'));
            });
            overlay.addEventListener('click', function() { toggleSidebar(false); });
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });

            // ===== TOAST =====
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icon = type === 'success' ? checkSvg : type === 'error' ? errSvg : infoSvg;
                toast.innerHTML = icon + '<span>' + message + '</span>';
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'opacity 0.3s, transform 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 3200);
            }

            // ============================================================
            // DATA & FUNGSI TRANSLITERASI (logika tidak diubah)
            // ============================================================
            const kamusPegon = {
                "belajar": "بلاجار",
                "tempe": "تيمڤي",
                "bersender": "برسيندير",
                "allah": "الله",
                "alloh": "الله",
                "muhammad": "محمد"
            };

            const replacements = [
                { pattern: 'ny', replacement: 'ۑ' },
                { pattern: 'ng', replacement: 'ڠ' },
                { pattern: 'kh', replacement: 'خ' },
                { pattern: 'sy', replacement: 'ش' },
                { pattern: 'gh', replacement: 'غ' },
                { pattern: '\bi', replacement: 'اي' },
                { pattern: '\bu', replacement: 'او' },
                { pattern: '\ba', replacement: 'ا' },
                { pattern: '\bo', replacement: 'او' },
                { pattern: '\be', replacement: 'اي' },
                { pattern: 'a', replacement: 'ا' },
                { pattern: 'b', replacement: 'ب' },
                { pattern: 'c', replacement: 'چ' },
                { pattern: 'd', replacement: 'د' },
                { pattern: 'e', replacement: 'ي' },
                { pattern: 'E', replacement: 'ٓ' },
                { pattern: 'f', replacement: 'ف' },
                { pattern: 'g', replacement: 'ڮ' },
                { pattern: 'h', replacement: 'ه' },
                { pattern: 'i', replacement: 'ي' },
                { pattern: 'j', replacement: 'ج' },
                { pattern: 'k', replacement: 'ك' },
                { pattern: 'l', replacement: 'ل' },
                { pattern: 'm', replacement: 'م' },
                { pattern: 'n', replacement: 'ن' },
                { pattern: 'o', replacement: 'و' },
                { pattern: 'p', replacement: 'ڤ' },
                { pattern: 'q', replacement: 'ق' },
                { pattern: 'r', replacement: 'ر' },
                { pattern: 's', replacement: 'س' },
                { pattern: 't', replacement: 'ت' },
                { pattern: 'u', replacement: 'و' },
                { pattern: 'v', replacement: 'ف' },
                { pattern: 'w', replacement: 'و' },
                { pattern: 'x', replacement: 'كس' },
                { pattern: 'y', replacement: 'ي' },
                { pattern: 'z', replacement: 'ز' },
                { pattern: ',', replacement: '،' },
                { pattern: '\\?', replacement: '؟' },
                { pattern: ';', replacement: '؛' }
            ];

            function transliterate(text) {
                if (!text) return '';
                let result = text.replace(/\b[a-zA-Z]+\b/g, function(match) {
                    const kataKecil = match.toLowerCase();
                    if (kamusPegon[kataKecil]) return kamusPegon[kataKecil];
                    return match;
                });
                const sorted = [...replacements].sort((a, b) => b.pattern.length - a.pattern.length);
                for (const item of sorted) {
                    const escaped = item.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'g');
                    result = result.replace(regex, item.replacement);
                }
                return result;
            }

            function performTransliteration() {
                const raw = inputText.value.trim();
                if (!raw) {
                    showToast('Teks input tidak boleh kosong.', 'error');
                    resultBox.classList.remove('visible');
                    return;
                }
                const result = transliterate(raw);
                resultText.textContent = result;
                resultBox.classList.add('visible');
            }

            // ===== RIWAYAT =====
            function getHistory() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
                catch (_) { return []; }
            }

            function saveHistoryEntry(original, result) {
                const history = getHistory();
                const entry = { original, result, timestamp: Date.now() };
                if (!history.some(h => h.result === result && h.original === original)) {
                    history.unshift(entry);
                    if (history.length > 50) history.pop();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                    renderAllHistory();
                    showToast('Berhasil disimpan ke riwayat.', 'success');
                } else {
                    showToast('Data sudah ada di riwayat.', 'info');
                }
            }

            function deleteHistoryItem(index) {
                const history = getHistory();
                if (index >= 0 && index < history.length) {
                    history.splice(index, 1);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                    renderAllHistory();
                    showToast('Riwayat dihapus.', 'info');
                }
            }

            function clearAllHistory() {
                if (getHistory().length === 0) {
                    showToast('Riwayat sudah kosong.', 'info');
                    return;
                }
                showModal('⚠️ Hapus semua riwayat?', 'Semua data riwayat transliterasi akan dihapus permanen.', 'Ya, Hapus Semua', 'danger').then(confirmed => {
                    if (confirmed) {
                        localStorage.removeItem(STORAGE_KEY);
                        renderAllHistory();
                        showToast('Semua riwayat dihapus.', 'success');
                    }
                });
            }

            function renderAllHistory() {
                renderHistoryMain();
                renderHistorySidebar();
            }

            function escapeHtml(str) {
                if (str === undefined || str === null) return '';
                const div = document.createElement('div');
                div.textContent = String(str);
                return div.innerHTML;
            }

            function renderHistoryMain() {
                const history = getHistory();
                historyCountMain.textContent = `${history.length} item`;
                if (history.length === 0) {
                    historyListMain.innerHTML = `<div class="history-empty">Belum ada riwayat transliterasi.</div>`;
                    return;
                }
                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', {
                        hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short', year: 'numeric'
                    });
                    html += `
                        <div class="history-item-main">
                            <div class="h-left">
                                <div class="h-original">${escapeHtml(item.original.substring(0, 80))}${item.original.length > 80 ? '…' : ''}</div>
                                <div class="h-arabic">${escapeHtml(item.result.substring(0, 80))}${item.result.length > 80 ? '…' : ''}</div>
                                <div class="h-meta">${time}</div>
                            </div>
                            <div class="h-actions">
                                <button class="btn btn-outline btn-sm" data-action="copy" data-index="${index}" title="Salin">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                </button>
                                <button class="btn btn-danger-ghost btn-sm" data-action="delete" data-index="${index}" title="Hapus">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
                historyListMain.innerHTML = html;

                historyListMain.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const act = this.dataset.action;
                        const item = getHistory()[idx];
                        if (!item) return;
                        if (act === 'copy') copyText(item.result);
                        else if (act === 'delete') deleteHistoryItem(idx);
                    });
                });
            }

            function renderHistorySidebar() {
                const history = getHistory();
                if (history.length === 0) {
                    sidebarContent.innerHTML = `<div class="file-list-empty">${emptyFolderSvg}Belum ada riwayat</div>`;
                    return;
                }
                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    const label = item.original.length > 22 ? item.original.substring(0, 22) + '…' : item.original;
                    html += `
                        <div class="file-item" data-index="${index}">
                            <span class="file-item-name">${escapeHtml(label)}</span>
                            <span style="font-size:11px;color:var(--sidebar-text-dim);flex-shrink:0;">${time}</span>
                            <button class="file-item-menu" data-index="${index}" aria-label="Menu riwayat">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                                </svg>
                            </button>
                            <div class="dropdown" data-index="${index}">
                                <button class="dropdown-item" data-action="load" data-index="${index}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                    Muat Ulang
                                </button>
                                <button class="dropdown-item" data-action="copy" data-index="${index}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                    Salin Hasil
                                </button>
                                <button class="dropdown-item danger" data-action="delete" data-index="${index}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    Hapus
                                </button>
                            </div>
                        </div>
                    `;
                });
                sidebarContent.innerHTML = html;

                sidebarContent.querySelectorAll('.file-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.file-item-menu') || e.target.closest('.dropdown')) return;
                        const idx = parseInt(this.dataset.index);
                        loadHistoryItem(idx);
                        if (window.innerWidth <= 768) toggleSidebar(false);
                    });
                });

                sidebarContent.querySelectorAll('.file-item-menu').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const dropdown = this.parentElement.querySelector('.dropdown');
                        if (!dropdown) return;
                        closeAllDropdowns();
                        dropdown.classList.toggle('open');
                    });
                });

                sidebarContent.querySelectorAll('.dropdown-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const act = this.dataset.action;
                        const idx = parseInt(this.dataset.index);
                        closeAllDropdowns();
                        const history = getHistory();
                        if (!history[idx]) return;
                        if (act === 'load') loadHistoryItem(idx);
                        else if (act === 'copy') copyText(history[idx].result);
                        else if (act === 'delete') deleteHistoryItem(idx);
                    });
                });
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
            }
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.file-item-menu') && !e.target.closest('.dropdown')) {
                    closeAllDropdowns();
                }
            });

            function loadHistoryItem(index) {
                const history = getHistory();
                if (history[index]) {
                    inputText.value = history[index].original;
                    performTransliteration();
                    switchView('converter');
                }
            }

            // ===== COPY =====
            function copyText(text) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('Teks disalin ke clipboard!', 'success');
                    }).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }
            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('Teks disalin ke clipboard!', 'success');
                } catch (_) { showToast('Gagal menyalin.', 'error'); }
                document.body.removeChild(ta);
            }

            // ===== SIMPAN =====
            function handleSave() {
                const raw = inputText.value.trim();
                const result = resultText.textContent;
                if (!raw || !result || result === '-') {
                    showToast('Tidak ada hasil untuk disimpan.', 'error');
                    return;
                }
                saveHistoryEntry(raw, result);
            }

            // ===== SWITCH VIEW =====
            function switchView(view) {
                if (view === 'converter') {
                    viewConverter.classList.remove('hidden');
                    viewHistory.classList.add('hidden');
                    navConverter.classList.add('btn-sidebar-primary');
                    navHistory.classList.remove('btn-sidebar-primary');
                    headerTitle.innerHTML = `<span class="dot"></span>Konverter`;
                } else {
                    viewConverter.classList.add('hidden');
                    viewHistory.classList.remove('hidden');
                    navHistory.classList.add('btn-sidebar-primary');
                    navConverter.classList.remove('btn-sidebar-primary');
                    headerTitle.innerHTML = `<span class="dot"></span>Riwayat`;
                    renderHistoryMain();
                }
                if (window.innerWidth <= 768) toggleSidebar(false);
            }

            navConverter.addEventListener('click', () => switchView('converter'));
            navHistory.addEventListener('click', () => switchView('history'));

            // ===== MODAL =====
            let modalResolve = null;
            function showModal(title, message, confirmLabel = 'OK', type = 'primary') {
                return new Promise((resolve) => {
                    modalTitle.textContent = title;
                    modalMessage.textContent = message;
                    const isDanger = (type === 'danger');
                    modalConfirmBtn.className = 'btn ' + (isDanger ? 'btn-modal-danger' : 'btn-modal-primary');
                    modalConfirmBtn.textContent = confirmLabel;
                    modalCancelBtn.textContent = 'Batal';
                    modalOverlay.classList.add('active');
                    modalResolve = resolve;
                });
            }
            modalCancelBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) { modalResolve(false); modalResolve = null; }
            });
            modalConfirmBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) { modalResolve(true); modalResolve = null; }
            });
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) { modalResolve(false); modalResolve = null; }
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) { modalResolve(false); modalResolve = null; }
                }
            });

            // ===== EVENT LISTENERS =====
            transliterateBtn.addEventListener('click', performTransliteration);
            saveBtn.addEventListener('click', handleSave);

            inputText.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    performTransliteration();
                }
            });

            pasteBtn.addEventListener('click', async function() {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        inputText.value = text;
                        showToast('Teks ditempel dari clipboard.', 'info');
                    }
                } catch (_) {
                    showToast('Gagal mengakses clipboard. Tempel manual (Ctrl+V).', 'error');
                }
            });

            resetBtn.addEventListener('click', function() {
                inputText.value = '';
                resultBox.classList.remove('visible');
                showToast('Input dibersihkan.', 'info');
            });

            copyBtn.addEventListener('click', function() {
                const text = resultText.textContent;
                if (text && text !== '-') copyText(text);
                else showToast('Tidak ada teks untuk disalin.', 'error');
            });

            clearHistoryBtnMain.addEventListener('click', clearAllHistory);

            // ===== INISIALISASI =====
            renderAllHistory();
            switchView('converter');

            console.log('🕌 Pegonin web app siap.');
        })();
    </script>
</body>
</html>
