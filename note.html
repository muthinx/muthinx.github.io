            const readView = document.getElementById('readView');
            const counterInfo = document.getElementById('counterInfo');
            const headerCopyBtn = document.getElementById('headerCopyBtn');
            const headerClearBtn = document.getElementById('headerClearBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const newFileBtn = document.getElementById('newFileBtn');
            const fileInput = document.getElementById('fileInput');
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            const editModeBtn = document.getElementById('editModeBtn');
            const readModeBtn = document.getElementById('readModeBtn');

            // Modal
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalExtra = document.getElementById('modalExtra');
            const modalInput = document.getElementById('modalInput');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');

            // ----- Data -----
            const STORAGE_KEY = 'notepadTransitFiles';
            const ACTIVE_KEY = 'notepadTransitActiveId';
            const VIEW_MODE_KEY = 'notepadTransitViewMode';
            let files = [];
            let activeId = null;
            let modalResolve = null;
            let currentMode = 'edit';
            const MAX_HISTORY = 100;

            // ----- Helper -----
            function genId() {
                return Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            }

            // =====================================================
            // MARKDOWN PARSER
            // =====================================================
            // Escape HTML TAPI pertahankan `>` (untuk blockquote markdown).
            // `<`, `&`, `"`, `'` di-escape agar aman dari XSS.
            function escapeHtmlForMarkdown(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // Parse inline: code, image, link, bold, italic
            function parseInline(text) {
                // 1. Inline code — pakai placeholder supaya tidak diproses regex lain
                const codePlaceholders = [];
                text = text.replace(/`([^`\n]+)`/g, function(match, code) {
                    const ph = '\u0000MDCODE' + codePlaceholders.length + '\u0000';
                    codePlaceholders.push('<code class="md-inline-code">' + code + '</code>');
                    return ph;
                });

                // 2. Image (harus sebelum link)
                text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(match, alt, url) {
                    if (/^https?:\/\//i.test(url)) {
                        return '<img class="md-img" src="' + url + '" alt="' + alt + '" loading="lazy">';
                    }
                    return match;
                });

                // 3. Link — hanya izinkan http(s), mailto, dan anchor #
                text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(match, label, url) {
                    if (/^(https?:\/\/|mailto:|#)/i.test(url)) {
                        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
                    }
                    return match;
                });

                // 4. Bold (**text** atau __text__)
                text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
                text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');

                // 5. Italic (*text* atau _text_)
                text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
                text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');

                // 6. Restore inline code placeholders
                text = text.replace(/\u0000MDCODE(\d+)\u0000/g, function(match, idx) {
                    return codePlaceholders[parseInt(idx, 10)] || '';
                });

                // 7. Single newline -> <br>
                text = text.replace(/\n/g, '<br>');

                return text;
            }

            // Parse tabel dari beberapa baris "| ... |"
            function renderTable(tableLines) {
                if (tableLines.length < 2) return '';

                function splitRow(line) {
                    return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function(c) {
                        return c.trim();
                    });
                }

                const headerCells = splitRow(tableLines[0]);
                const sepLine = tableLines[1];
                const isSeparator = /^\s*\|[\s\-:|]+\|\s*$/.test(sepLine);

                const colCount = headerCells.length;
                let html = '<div class="md-table-wrap">' +
                    '<table style="--cols: ' + colCount + '"><thead><tr>';
                headerCells.forEach(function(cell) {
                    html += '<th>' + parseInline(cell) + '</th>';
                });
                html += '</tr></thead>';

                const dataLines = isSeparator ? tableLines.slice(2) : tableLines.slice(1);

                if (dataLines.length > 0) {
                    html += '<tbody>';
                    dataLines.forEach(function(row) {
                        const cells = splitRow(row);
                        html += '<tr>';
                        cells.forEach(function(cell) {
                            html += '<td>' + parseInline(cell) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody>';
                }

                html += '</table></div>';
                return html;
            }

            // Parse block-level markdown. Input SUDAH di-escape.
            function parseBlocks(src) {
                const lines = src.split('\n');
                let html = '';
                let i = 0;

                const blockquoteRe = /^\s{0,3}>\s?/;

                while (i < lines.length) {
                    const line = lines[i];

                    // Fenced code block
                    const fenceMatch = line.match(/^```(\w*)\s*$/);
                    if (fenceMatch) {
                        const lang = fenceMatch[1];
                        const codeLines = [];
                        i++;
                        while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                            codeLines.push(lines[i]);
                            i++;
                        }
                        i++; // skip closing fence
                        const codeHtml = codeLines.join('\n');
                        const langLabel = lang ?
                            '<span class="md-code-lang">' + lang + '</span>' : '';
                        html += '<div class="md-code-block">' + langLabel +
                            '<pre><code>' + codeHtml + '</code></pre></div>';
                        continue;
                    }

                    // Heading
                    const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
                    if (headingMatch) {
                        const level = headingMatch[1].length;
                        html += '<h' + level + '>' + parseInline(headingMatch[2]) + '</h' + level + '>';
                        i++;
                        continue;
                    }

                    // Horizontal rule (---, ***, ___, - - -, etc.)
                    if (/^\s*([-*_]\s*){3,}$/.test(line)) {
                        html += '<hr>';
                        i++;
                        continue;
                    }

                    // Table
                    if (/^\s*\|.*\|\s*$/.test(line)) {
                        const tableLines = [];
                        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
                            tableLines.push(lines[i]);
                            i++;
                        }
                        html += renderTable(tableLines);
                        continue;
                    }

                    // Blockquote
                    if (blockquoteRe.test(line)) {
                        const quoteLines = [];
                        while (i < lines.length && blockquoteRe.test(lines[i])) {
                            quoteLines.push(lines[i].replace(blockquoteRe, ''));
                            i++;
                        }
                        html += '<blockquote>' + parseBlocks(quoteLines.join('\n')) + '</blockquote>';
                        continue;
                    }

                    // List (unordered / ordered)
                    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
                        const isOrdered = /^\s*\d+\.\s+/.test(line);
                        const items = [];
                        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
                            items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
                            i++;
                        }
                        const tag = isOrdered ? 'ol' : 'ul';
                        html += '<' + tag + '>';
                        items.forEach(function(item) {
                            html += '<li>' + parseInline(item) + '</li>';
                        });
                        html += '</' + tag + '>';
                        continue;
                    }

                    // Blank line — skip
                    if (line.trim() === '') {
                        i++;
                        continue;
                    }

                    // Paragraph — kumpulkan sampai blank line / block lain
                    const paraLines = [];
                    while (
                        i < lines.length &&
                        lines[i].trim() !== '' &&
                        !/^```/.test(lines[i]) &&
                        !/^#{1,6}\s+/.test(lines[i]) &&
                        !/^\s*([-*_]\s*){3,}$/.test(lines[i]) &&
                        !/^\s*\|.*\|\s*$/.test(lines[i]) &&
                        !blockquoteRe.test(lines[i]) &&
                        !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])
                    ) {
                        paraLines.push(lines[i]);
                        i++;
                    }
                    if (paraLines.length > 0) {
                        html += '<p>' + parseInline(paraLines.join('\n')) + '</p>';
                    } else {
                        i++;
                    }
                }

                return html;
            }

            // Entry point
            function renderMarkdown(rawSrc) {
                if (!rawSrc || !rawSrc.trim()) return '';
                const escaped = escapeHtmlForMarkdown(rawSrc);
                return parseBlocks(escaped);
            }

            // =====================================================
            // MODE / VIEW HANDLING
            // =====================================================
            function setMode(mode) {
                currentMode = (mode === 'read') ? 'read' : 'edit';
                try {
                    localStorage.setItem(VIEW_MODE_KEY, currentMode);
                } catch (e) {}

                const isRead = (currentMode === 'read');

                if (isRead) {
                    textarea.classList.add('hidden');
                    readView.classList.remove('hidden');
                    renderReadView();
                } else {
                    textarea.classList.remove('hidden');
                    readView.classList.add('hidden');
                    textarea.focus();
                }

                // Update tombol toggle
                editModeBtn.classList.toggle('active', !isRead);
                readModeBtn.classList.toggle('active', isRead);
                editModeBtn.setAttribute('aria-selected', String(!isRead));
                readModeBtn.setAttribute('aria-selected', String(isRead));

                // Update undo/redo state
                updateUndoRedoButtons();
            }

            function renderReadView() {
                const active = getActiveFile();
                const content = active ? (active.content || '') : '';
                if (!content.trim()) {
                    readView.innerHTML = '<div class="read-empty">Belum ada konten untuk ditampilkan.</div>';
                } else {
                    readView.innerHTML = '<div class="markdown-body">' + renderMarkdown(content) + '</div>';
                }
            }

            editModeBtn.addEventListener('click', function() {
                if (currentMode !== 'edit') setMode('edit');
            });
            readModeBtn.addEventListener('click', function() {
                if (currentMode !== 'read') setMode('read');
            });

            // =====================================================
            // HISTORY
            // =====================================================
            function initHistory(file) {
                if (!file.history || !Array.isArray(file.history)) {
                    file.history = [file.content || ''];
                    file.historyIndex = 0;
                }
                if (file.history.length === 0) {
                    file.history.push(file.content || '');
                    file.historyIndex = 0;
                }
                if (file.historyIndex >= file.history.length) {
                    file.historyIndex = file.history.length - 1;
                }
            }

            function pushHistory(file, newContent) {
                if (!file) return;
                initHistory(file);
                const last = file.history[file.historyIndex];
                if (last === newContent) return;
                file.history = file.history.slice(0, file.historyIndex + 1);
                file.history.push(newContent);
                if (file.history.length > MAX_HISTORY) {
                    file.history.shift();
                }
                file.historyIndex = file.history.length - 1;
                updateUndoRedoButtons();
            }

            function undoFile(file) {
                if (!file || currentMode === 'read') return;
                initHistory(file);
                if (file.historyIndex > 0) {
                    file.historyIndex--;
                    const content = file.history[file.historyIndex];
                    file.content = content;
                    textarea.value = content;
                    saveData();
                    updateUI();
                    updateCounter();
                    updateUndoRedoButtons();
                }
            }

            function redoFile(file) {
                if (!file || currentMode === 'read') return;
                initHistory(file);
                if (file.historyIndex < file.history.length - 1) {
                    file.historyIndex++;
                    const content = file.history[file.historyIndex];
                    file.content = content;
                    textarea.value = content;
                    saveData();
                    updateUI();
                    updateCounter();
                    updateUndoRedoButtons();
                }
            }

            function updateUndoRedoButtons() {
                if (currentMode === 'read') {
                    undoBtn.disabled = true;
                    redoBtn.disabled = true;
                    return;
                }
                const active = getActiveFile();
                if (active) {
                    initHistory(active);
                    undoBtn.disabled = (active.historyIndex <= 0);
                    redoBtn.disabled = (active.historyIndex >= active.history.length - 1);
                } else {
                    undoBtn.disabled = true;
                    redoBtn.disabled = true;
                }
            }

            // =====================================================
            // LOAD / SAVE
            // =====================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    files = raw ? JSON.parse(raw) : [];
                    files = files.filter(f => f.id && f.name !== undefined && f.content !== undefined);
                    files.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    files.forEach(f => {
                        if (!f.history || !Array.isArray(f.history)) {
                            f.history = [f.content || ''];
                            f.historyIndex = 0;
                        } else {
                            if (f.historyIndex === undefined || f.historyIndex >= f.history.length) {
                                f.historyIndex = f.history.length - 1;
                            }
                            if (f.history[f.historyIndex] !== f.content) {
                                f.history.push(f.content);
                                f.historyIndex = f.history.length - 1;
                            }
                        }
                    });
                } catch (e) {
                    files = [];
                }
                activeId = localStorage.getItem(ACTIVE_KEY) || null;
                if (activeId && !files.some(f => f.id === activeId)) {
                    activeId = null;
                }
                if (files.length === 0) {
                    createDefaultFile();
                } else if (!activeId) {
                    activeId = files[0].id;
                }
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
                if (activeId) {
                    localStorage.setItem(ACTIVE_KEY, activeId);
                } else {
                    localStorage.removeItem(ACTIVE_KEY);
                }
            }

            function createDefaultFile() {
                const newFile = {
                    id: genId(),
                    name: 'Catatan 1',
                    content: '',
                    createdAt: Date.now(),
                    history: [''],
                    historyIndex: 0
                };
                files = [newFile];
                activeId = newFile.id;
                saveData();
            }

            // =====================================================
            // CRUD
            // =====================================================
            function getActiveFile() {
                return files.find(f => f.id === activeId) || null;
            }

            function setActiveFile(id) {
                if (files.some(f => f.id === id)) {
                    saveCurrentContent();
                    activeId = id;
                    saveData();
                    renderFileList();
                    updateUI();
                    updateUndoRedoButtons();
                }
            }

            function addFile(name, content = '') {
                let finalName = name;
                let counter = 1;
                while (files.some(f => f.name === finalName)) {
                    const base = name.replace(/\s*\(\d+\)$/, '');
                    finalName = base + ' (' + counter + ')';
                    counter++;
                }
                const newFile = {
                    id: genId(),
                    name: finalName,
                    content: content || '',
                    createdAt: Date.now(),
                    history: [content || ''],
                    historyIndex: 0
                };
                files.unshift(newFile);
                activeId = newFile.id;
                saveData();
                renderFileList();
                updateUI();
                updateUndoRedoButtons();
                return newFile;
            }

            function deleteFile(id) {
                const idx = files.findIndex(f => f.id === id);
                if (idx === -1) return false;
                files.splice(idx, 1);
                if (files.length === 0) {
                    createDefaultFile();
                } else if (activeId === id) {
                    activeId = files[0].id;
                }
                saveData();
                renderFileList();
                updateUI();
                updateUndoRedoButtons();
                return true;
            }

            function renameFile(id, newName) {
                const file = files.find(f => f.id === id);
                if (!file) return false;
                let finalName = newName.trim() || 'Tanpa Nama';
                let counter = 1;
                while (files.some(f => f.id !== id && f.name === finalName)) {
                    const base = finalName.replace(/\s*\(\d+\)$/, '');
                    finalName = base + ' (' + counter + ')';
                    counter++;
                }
                file.name = finalName;
                saveData();
                renderFileList();
                updateUI();
                return true;
            }

            // =====================================================
            // RENDER FILE LIST
            // =====================================================
            function renderFileList() {
                if (!fileListContainer) return;
                if (files.length === 0) {
                    fileListContainer.innerHTML =
                        '<div class="file-list-empty">Belum ada catatan<br>Buat file baru atau upload .txt</div>';
                    return;
                }
                let html = '';
                files.forEach(file => {
                    const isActive = (file.id === activeId);
                    html += `
                        <div class="file-item ${isActive ? 'active' : ''}" data-id="${file.id}">
                            <span class="file-item-name">${escapeHtml(file.name)}</span>
                            <button class="file-item-menu" data-id="${file.id}" aria-label="Menu file">
                                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="5" r="1.5" />
                                    <circle cx="12" cy="12" r="1.5" />
                                    <circle cx="12" cy="19" r="1.5" />
                                </svg>
                            </button>
                            <div class="dropdown" data-id="${file.id}">
                                <button class="dropdown-item" data-action="copy" data-id="${file.id}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                    Salin Semua
                                </button>
                                <button class="dropdown-item" data-action="rename" data-id="${file.id}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                                    Ganti Nama
                                </button>
                                <button class="dropdown-item" data-action="download" data-id="${file.id}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    Download .txt
                                </button>
                                <button class="dropdown-item danger" data-action="delete" data-id="${file.id}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    Hapus
                                </button>
                            </div>
                        </div>
                    `;
                });
                fileListContainer.innerHTML = html;

                document.querySelectorAll('.file-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.file-item-menu') || e.target.closest('.dropdown')) return;
                        const id = this.dataset.id;
                        if (id && id !== activeId) {
                            setActiveFile(id);
                            closeAllDropdowns();
                            if (window.innerWidth <= 768) toggleSidebar(false);
                        }
                    });
                });

                document.querySelectorAll('.file-item-menu').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const dropdown = this.parentElement.querySelector('.dropdown');
                        if (!dropdown) return;
                        closeAllDropdowns();
                        dropdown.classList.toggle('open');
                    });
                });

                document.querySelectorAll('.dropdown-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const action = this.dataset.action;
                        const id = this.dataset.id;
                        if (!id) return;
                        const file = files.find(f => f.id === id);
                        if (!file) return;
                        const dropdown = this.closest('.dropdown');
                        if (dropdown) dropdown.classList.remove('open');

                        switch (action) {
                            case 'copy': copyFileContent(file); break;
                            case 'rename': promptRename(file); break;
                            case 'download': downloadFile(file); break;
                            case 'delete': promptDeleteFile(file); break;
                            default: break;
                        }
                    });
                });

                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.file-item-menu') && !e.target.closest('.dropdown')) {
                        closeAllDropdowns();
                    }
                });
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // =====================================================
            // UPDATE UI
            // =====================================================
            function updateUI() {
                const active = getActiveFile();
                if (active) {
                    const dotSpan = fileNameDisplay.querySelector('.dot');
                    if (dotSpan) {
                        fileNameDisplay.innerHTML = '<span class="dot"></span>' + escapeHtml(active.name);
                    } else {
                        fileNameDisplay.textContent = active.name;
                    }
                    if (textarea.value !== active.content) {
                        textarea.value = active.content;
                    }
                } else {
                    fileNameDisplay.innerHTML = '<span class="dot"></span>(tidak ada file)';
                    textarea.value = '';
                }
                updateCounter();
                document.querySelectorAll('.file-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.id === activeId);
                });
                updateUndoRedoButtons();

                // Kalau sedang di mode Baca, re-render supaya sinkron
                if (currentMode === 'read') {
                    renderReadView();
                }
            }

            function updateCounter() {
                const text = textarea.value;
                const charCount = text.length;
                const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                const lineCount = text === '' ? 0 : text.split('\n').length;
                counterInfo.textContent = charCount + ' karakter · ' + wordCount + ' kata · ' + lineCount + ' baris';
            }

            function saveCurrentContent() {
                const active = getActiveFile();
                if (active) {
                    const newContent = textarea.value;
                    if (active.content !== newContent) {
                        active.content = newContent;
                        pushHistory(active, newContent);
                        saveData();
                    }
                }
            }

            // =====================================================
            // EVENT: textarea input
            // =====================================================
            textarea.addEventListener('input', function() {
                const active = getActiveFile();
                if (active) {
                    const newContent = textarea.value;
                    if (active.content !== newContent) {
                        active.content = newContent;
                        pushHistory(active, newContent);
                        saveData();
                    }
                }
                updateCounter();
            });

            // Undo / Redo
            undoBtn.addEventListener('click', function() {
                const active = getActiveFile();
                if (active) undoFile(active);
            });

            redoBtn.addEventListener('click', function() {
                const active = getActiveFile();
                if (active) redoFile(active);
            });

            document.addEventListener('keydown', function(e) {
                if (currentMode === 'read') return;
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    if (!e.shiftKey) {
                        e.preventDefault();
                        undoBtn.click();
                    } else {
                        e.preventDefault();
                        redoBtn.click();
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    redoBtn.click();
                }
            });

            // Header: Salin (menyalin markdown asli dari textarea)
            headerCopyBtn.addEventListener('click', async function() {
                const text = textarea.value;
                if (!text) {
                    alert('Tidak ada teks untuk disalin.');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(text);
                    const orig = headerCopyBtn.innerHTML;
                    headerCopyBtn.innerHTML =
                        '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
                    setTimeout(() => { headerCopyBtn.innerHTML = orig; }, 1500);
                } catch (err) {
                    textarea.select();
                    document.execCommand('copy');
                    alert('Teks berhasil disalin (metode cadangan).');
                }
            });

            // Header: Hapus semua
            headerClearBtn.addEventListener('click', function() {
                const active = getActiveFile();
                if (!active) {
                    alert('Tidak ada file aktif.');
                    return;
                }
                if (active.content.trim() === '') {
                    alert('File ini sudah kosong.');
                    return;
                }
                showModal(
                    '⚠️ Hapus semua teks?',
                    'Semua teks di file "' + active.name +
                    '" akan dihapus. Tindakan ini tidak bisa dibatalkan.',
                    'Hapus Teks',
                    'danger'
                ).then(confirmed => {
                    if (confirmed) {
                        active.content = '';
                        textarea.value = '';
                        pushHistory(active, '');
                        saveData();
                        updateCounter();
                        updateUI();
                    }
                });
            });

            // Sidebar toggle
            function toggleSidebar(open) {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('active', open);
                }
            }
            hamburger.addEventListener('click', function() {
                toggleSidebar(!sidebar.classList.contains('open'));
            });
            overlay.addEventListener('click', function() {
                toggleSidebar(false);
            });
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });

            // Upload
            uploadBtn.addEventListener('click', function() {
                fileInput.click();
            });
            fileInput.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const content = ev.target.result;
                    const name = file.name.replace(/\.txt$/i, '');
                    addFile(name, content);
                    if (window.innerWidth <= 768) toggleSidebar(false);
                    fileInput.value = '';
                };
                reader.readAsText(file);
            });

            // Buat baru
            newFileBtn.addEventListener('click', function() {
                let maxNum = 0;
                files.forEach(f => {
                    const match = f.name.match(/^Catatan (\d+)$/);
                    if (match) {
                        const num = parseInt(match[1], 10);
                        if (num > maxNum) maxNum = num;
                    }
                });
                const newName = 'Catatan ' + (maxNum + 1);
                addFile(newName, '');
                if (window.innerWidth <= 768) toggleSidebar(false);
            });

            // Dropdown actions
            function copyFileContent(file) {
                if (!file.content) {
                    alert('File ini kosong.');
                    return;
                }
                navigator.clipboard.writeText(file.content).then(() => {
                    alert('Teks dari "' + file.name + '" telah disalin ke clipboard.');
                }).catch(() => {
                    const temp = textarea;
                    const prev = temp.value;
                    temp.value = file.content;
                    temp.select();
                    document.execCommand('copy');
                    temp.value = prev;
                    alert('Teks dari "' + file.name + '" telah disalin (metode cadangan).');
                });
            }

            function downloadFile(file) {
                const blob = new Blob([file.content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function promptRename(file) {
                showModal(
                    '✏️ Ganti Nama',
                    'Masukkan nama baru untuk "' + file.name + '":',
                    'Simpan',
                    'primary',
                    true,
                    file.name
                ).then(result => {
                    if (result && result.trim() !== '') {
                        renameFile(file.id, result.trim());
                    }
                });
            }

            function promptDeleteFile(file) {
                showModal(
                    '⚠️ Hapus file?',
                    'Anda akan menghapus file "' + file.name + '". Data tidak bisa dikembalikan.',
                    'Ya, Hapus',
                    'danger'
                ).then(confirmed => {
                    if (confirmed) {
                        deleteFile(file.id);
                        updateUI();
                    }
                });
            }

            // Modal System
            function showModal(title, message, confirmLabel = 'OK', type = 'primary', showInput = false,
                inputValue = '') {
                return new Promise((resolve) => {
                    modalTitle.textContent = title;
                    modalMessage.textContent = message;
                    modalExtra.style.display = showInput ? 'block' : 'none';
                    if (showInput) {
                        modalInput.value = inputValue || '';
                        modalInput.focus();
                        modalInput.select();
                    }
                    const isDanger = (type === 'danger');
                    modalConfirmBtn.className = 'btn ' + (isDanger ? 'btn-modal-danger' : 'btn-modal-primary');
                    modalConfirmBtn.textContent = confirmLabel;
                    modalCancelBtn.textContent = 'Batal';

                    modalOverlay.classList.add('active');
                    modalResolve = resolve;
                });
            }

            modalCancelBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) {
                    const showInput = modalExtra.style.display !== 'none';
                    modalResolve(showInput ? null : false);
                    modalResolve = null;
                }
            });

            modalConfirmBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) {
                    const showInput = modalExtra.style.display !== 'none';
                    modalResolve(showInput ? modalInput.value : true);
                    modalResolve = null;
                }
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) {
                        const showInput = modalExtra.style.display !== 'none';
                        modalResolve(showInput ? null : false);
                        modalResolve = null;
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) {
                        const showInput = modalExtra.style.display !== 'none';
                        modalResolve(showInput ? null : false);
                        modalResolve = null;
                    }
                }
                if (e.key === 'Enter' && modalOverlay.classList.contains('active') &&
                    modalExtra.style.display !== 'none') {
                    modalConfirmBtn.click();
                }
            });

            // =====================================================
            // PRINT
            // =====================================================
            const printBtn = document.getElementById('printBtn');
            const printContainer = document.getElementById('printContainer');

            function populatePrintContainer() {
                const active = getActiveFile();
                const content = active ? (active.content || '') : '';

                if (!content.trim()) {
                    printContainer.innerHTML =
                        '<div style="padding:20px;color:#666;font-style:italic;">Tidak ada konten untuk dicetak.</div>';
                    return;
                }

                const contentHtml = renderMarkdown(content);
                const fileName = (active && active.name) ? active.name : 'Tanpa Nama';

                printContainer.innerHTML =
                    '<table class="print-layout">' +
                        '<tbody><tr><td>' +
                            '<div class="markdown-body">' + contentHtml + '</div>' +
                        '</td></tr></tbody>' +
                        '<tfoot><tr><td>' +
                            '<div class="print-footer-content">' +
                                '<span class="print-filename">' + escapeHtml(fileName) + '</span>' +
                                '<span class="print-website">Notepad Transit</span>' +
                            '</div>' +
                        '</td></tr></tfoot>' +
                    '</table>';
            }

            // Populate otomatis untuk semua trigger print
            // (Ctrl+P, menu browser, atau tombol di bawah)
            window.addEventListener('beforeprint', populatePrintContainer);

            printBtn.addEventListener('click', function() {
                const active = getActiveFile();
                if (!active || !active.content.trim()) {
                    alert('File kosong — tidak ada yang bisa di-print.');
                    return;
                }
                populatePrintContainer();
                window.print();
            });

            // =====================================================
            // INIT
            // =====================================================
            function init() {
                // Baca mode tersimpan
                try {
                    const saved = localStorage.getItem(VIEW_MODE_KEY);
                    if (saved === 'read' || saved === 'edit') currentMode = saved;
                } catch (e) {}

                loadData();
                renderFileList();
                updateUI();
                updateUndoRedoButtons();

                // Terapkan mode
                setMode(currentMode);

                if (currentMode === 'edit') {
                    textarea.focus();
                }

                // Social links
                const socialLinks = document.querySelectorAll('.sidebar-footer a');
                if (socialLinks.length >= 4) {
                    socialLinks[0].href = 'https://instagram.com/salimmuthinx';
                    socialLinks[1].href = 'https://facebook.com/muthinx';
                    socialLinks[2].href = 'https://tiktok.com/@bengkel.kangacul';
                    socialLinks[3].href = 'https://github.com/muthinx';
                }
            }

            init();

            // Auto-save
            window.addEventListener('beforeunload', function() {
                saveCurrentContent();
            });
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) saveCurrentContent();
            });

        })();
    </script>
</body>
</html>
