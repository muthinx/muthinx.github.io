<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Bismillah" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f6ef7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>" />
    <title>Notepad Transit</title>
    <style>
        /* ----- RESET & GLOBAL ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6;
            overflow: hidden;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --sidebar-bg: #f4f6fa;
            --sidebar-hover: #e9ecf2;
            --sidebar-active: #dde1e9;
            --sidebar-border: #dce0e8;
            --sidebar-text: #1a1a2e;
            --sidebar-text-dim: #6b7280;
            --accent: #4f6ef7;
            --accent-hover: #3a55d9;
            --accent-glow: rgba(79, 110, 247, 0.25);
            --main-bg: #f0f2f6;
            --paper-bg: #ffffff;
            --paper-text: #1a1a2e;
            --header-bg: rgba(255, 255, 255, 0.72);
            --border-light: #e6e9f0;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c8ccd8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8aec0; }

        /* ----- APP LAYOUT ----- */
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px; min-width: 280px;
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            height: 100%; overflow: hidden;
            transition: transform var(--transition), min-width var(--transition);
            z-index: 100; flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            position: relative;
        }
        .sidebar-header {
            padding: 22px 20px 14px 20px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0; position: relative; z-index: 1;
        }
        .sidebar-logo {
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            background: var(--accent); border-radius: var(--radius-sm);
            color: white; box-shadow: 0 4px 16px var(--accent-glow);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-decoration: none;
        }
        .sidebar-logo svg { width: 20px; height: 20px; }
        .sidebar-logo:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 6px 24px var(--accent-glow);
            background: var(--accent-hover);
        }
        .sidebar-title { font-size: 17px; font-weight: 600; color: var(--sidebar-text); letter-spacing: -0.2px; white-space: nowrap; }
        .sidebar-title span { color: var(--accent); }
        .sidebar-actions {
            padding: 14px 16px; display: flex; flex-direction: row; gap: 8px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0; position: relative; z-index: 1;
        }
        .btn-sidebar {
            display: flex; flex: 1; align-items: center; gap: 8px;
            padding: 9px 12px; border: none; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 500; cursor: pointer;
            background: rgba(0, 0, 0, 0.04); color: var(--sidebar-text);
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            width: 100%; justify-content: center; font-family: inherit; letter-spacing: 0.2px;
        }
        .btn-sidebar:hover { background: rgba(0, 0, 0, 0.08); color: var(--sidebar-text); }
        .btn-sidebar:active { transform: scale(0.96); }
        .btn-sidebar svg { flex-shrink: 0; opacity: 0.7; }
        .btn-sidebar-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }
        .btn-sidebar-primary:hover { background: var(--accent-hover); color: #fff; box-shadow: 0 6px 24px var(--accent-glow); }
        .btn-sidebar-primary svg { opacity: 1; }

        /* ----- DAFTAR FILE ----- */
        .file-list-container {
            flex: 1; overflow-y: auto;
            padding: 8px 10px 20px 10px;
            position: relative; z-index: 1;
        }
        .file-list-container::-webkit-scrollbar { width: 4px; }
        .file-list-container::-webkit-scrollbar-thumb { background: #c8ccd8; border-radius: 10px; }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px 10px 14px; margin: 2px 0;
            border-radius: var(--radius-sm); cursor: pointer;
            transition: background var(--transition), transform 0.12s;
            position: relative; color: var(--sidebar-text); gap: 8px;
        }
        .file-item:hover { background: var(--sidebar-hover); }
        .file-item.active { background: var(--sidebar-active); box-shadow: inset 3px 0 0 var(--accent); font-weight: 500; }
        .file-item-name {
            font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; padding-right: 4px; letter-spacing: 0.1px;
        }
        .file-item-menu {
            flex-shrink: 0; background: none; border: none; cursor: pointer;
            padding: 4px 6px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: var(--sidebar-text-dim);
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        .file-item-menu:hover { background: rgba(0, 0, 0, 0.06); color: var(--sidebar-text); }

        /* ----- DROPDOWN ----- */
        .dropdown {
            position: absolute; right: 0; top: 110%;
            background: #ffffff; border-radius: var(--radius);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            min-width: 190px; padding: 6px 0; display: none;
            z-index: 200; animation: dropFade 0.18s ease-out;
            border: 1px solid var(--sidebar-border);
        }
        .dropdown.open { display: block; }
        @keyframes dropFade {
            from { opacity: 0; transform: scale(0.94) translateY(-8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 16px; font-size: 13px; color: var(--sidebar-text);
            border: none; background: none; width: 100%; text-align: left;
            cursor: pointer; transition: background 0.12s; border-radius: 0;
            font-family: inherit; letter-spacing: 0.1px;
        }
        .dropdown-item:hover { background: var(--sidebar-hover); }
        .dropdown-item:first-child { border-radius: var(--radius) var(--radius) 0 0; }
        .dropdown-item:last-child { border-radius: 0 0 var(--radius) var(--radius); }
        .dropdown-item.danger { color: #dc2626; }
        .dropdown-item.danger:hover { background: #fde8e8; }
        .dropdown-item svg { flex-shrink: 0; opacity: 0.7; }

        /* ===== FOOTER SIDEBAR ===== */
        .sidebar-footer {
            flex-shrink: 0; padding: 12px 16px 16px 16px;
            border-top: 1px solid var(--sidebar-border);
            display: flex; justify-content: center; gap: 14px;
        }
        .sidebar-footer a {
            color: var(--sidebar-text-dim);
            transition: color var(--transition), transform 0.15s;
            text-decoration: none; display: flex; align-items: center; justify-content: center;
        }
        .sidebar-footer a svg { width: 20px; height: 20px; }
        .sidebar-footer a:hover { color: var(--accent); transform: translateY(-2px) scale(1.1); }

        /* ----- AREA UTAMA ----- */
        .main {
            flex: 1; display: flex; flex-direction: column;
            height: 100%; min-width: 0;
            background: var(--main-bg); position: relative;
        }

        /* ----- HEADER / TOOLBAR ----- */
        .main-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 28px;
            background: var(--header-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0; min-height: 60px; gap: 12px;
            position: sticky; top: 0; z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .hamburger {
            display: none; background: none; border: none; cursor: pointer;
            padding: 6px; color: var(--paper-text); border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover { background: rgba(0, 0, 0, 0.05); }
        .file-name-display {
            font-size: 16px; font-weight: 500; color: var(--paper-text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            max-width: 320px; letter-spacing: -0.2px;
        }
        .file-name-display .dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); margin-right: 10px;
            vertical-align: middle; box-shadow: 0 0 12px var(--accent-glow);
        }
        .header-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

        .btn-icon {
            background: none; border: none; padding: 8px 10px;
            border-radius: var(--radius-sm); cursor: pointer; color: #5a5a72;
            transition: background var(--transition), color var(--transition), transform 0.12s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(0, 0, 0, 0.05); color: var(--paper-text); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon:disabled { opacity: 0.35; pointer-events: none; }
        .btn-icon-danger:hover { background: rgba(248, 113, 113, 0.12); color: #dc2626; }
        .btn-icon-primary:hover { background: rgba(79, 110, 247, 0.10); color: var(--accent); }
        .btn-icon-undo:hover { background: rgba(79, 110, 247, 0.08); color: var(--accent); }
        .header-divider { width: 1px; height: 28px; background: var(--border-light); margin: 0 4px; }

        /* ----- VIEW TOGGLE (Edit | Baca) ----- */
        .view-toggle {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.05);
            border-radius: var(--radius-sm);
            padding: 2px;
            gap: 2px;
            flex-shrink: 0;
            margin: 0 4px;
        }
        .view-toggle-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 11px; border: none; background: transparent;
            color: #5a5a72; font-size: 13px; font-weight: 500;
            cursor: pointer; border-radius: 6px;
            transition: background 0.18s, color 0.18s, box-shadow 0.18s;
            font-family: inherit; letter-spacing: 0.1px;
            white-space: nowrap;
        }
        .view-toggle-btn:hover { color: var(--paper-text); }
        .view-toggle-btn.active {
            background: #ffffff; color: var(--accent);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(79, 110, 247, 0.08);
        }
        .view-toggle-btn.active:hover { color: var(--accent); }
        .view-toggle-btn svg { width: 15px; height: 15px; }

        /* ----- PAPER WRAPPER ----- */
        .paper-wrapper {
            flex: 1; min-height: 0;
            padding: 24px 32px 16px 32px;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .paper-textarea {
            flex: 1; width: 100%;
            padding: 32px 40px; border: none; outline: none; resize: none;
            font-family: 'Inter', 'Segoe UI', Roboto, -apple-system, sans-serif;
            font-size: 16.5px; line-height: 1.85; color: var(--paper-text);
            background: var(--paper-bg); border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition);
            letter-spacing: 0.15px; overflow-y: auto;
        }
        .paper-textarea:focus {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(79, 110, 247, 0.15);
        }
        .paper-textarea::placeholder {
            color: #b0b4c8; font-weight: 350; letter-spacing: 0.2px;
        }
        .paper-textarea::-webkit-scrollbar { width: 6px; }
        .paper-textarea::-webkit-scrollbar-track { background: #f0f2f6; border-radius: 10px; }
        .paper-textarea::-webkit-scrollbar-thumb { background: #d0d4e0; border-radius: 10px; }
        .paper-textarea::-webkit-scrollbar-thumb:hover { background: #b8bcc8; }

        /* ===== READ VIEW ===== */
        .read-view {
            flex: 1; min-height: 0; width: 100%;
            padding: 32px 40px;
            background: var(--paper-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow-y: auto;
            font-family: 'Inter', 'Segoe UI', Roboto, -apple-system, sans-serif;
            font-size: 16.5px; line-height: 1.85; color: var(--paper-text);
            letter-spacing: 0.15px;
        }
        .read-view::-webkit-scrollbar { width: 6px; }
        .read-view::-webkit-scrollbar-track { background: #f0f2f6; border-radius: 10px; }
        .read-view::-webkit-scrollbar-thumb { background: #d0d4e0; border-radius: 10px; }
        .read-view::-webkit-scrollbar-thumb:hover { background: #b8bcc8; }

        .read-empty {
            text-align: center; color: var(--sidebar-text-dim);
            padding: 60px 20px; font-style: italic; font-size: 15px;
        }

        /* ----- MARKDOWN CONTENT STYLES ----- */
        .markdown-body > *:first-child { margin-top: 0; }
        .markdown-body > *:last-child { margin-bottom: 0; }

        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            font-weight: 600; line-height: 1.3;
            margin: 1.6em 0 0.65em 0;
            letter-spacing: -0.3px; color: var(--paper-text);
        }
        .markdown-body h1 { font-size: 1.9em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-light); }
        .markdown-body h2 { font-size: 1.5em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border-light); }
        .markdown-body h3 { font-size: 1.25em; }
        .markdown-body h4 { font-size: 1.1em; }
        .markdown-body h5 { font-size: 1em; }
        .markdown-body h6 { font-size: 0.92em; color: var(--sidebar-text-dim); }

        .markdown-body p { margin: 0 0 1em 0; }

        .markdown-body a {
            color: var(--accent); text-decoration: none;
            border-bottom: 1px solid rgba(79, 110, 247, 0.3);
            transition: border-color 0.15s;
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }

        .markdown-body strong { font-weight: 600; color: var(--paper-text); }
        .markdown-body em { font-style: italic; }

        .markdown-body ul, .markdown-body ol {
            margin: 0 0 1em 0; padding-left: 1.8em;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body li { margin: 0.3em 0; }
        .markdown-body li > p { margin: 0; }

        .markdown-body blockquote {
            margin: 0 0 1em 0; padding: 0.5em 1em;
            border-left: 3px solid var(--accent);
            background: rgba(79, 110, 247, 0.06);
            color: #4a4a5e;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        .markdown-body blockquote p:last-child { margin-bottom: 0; }

        .markdown-body hr {
            border: none; border-top: 1px solid var(--border-light);
            margin: 1.8em 0;
        }

        .markdown-body code.md-inline-code {
            background: #eef1f7; color: #d63384;
            padding: 0.15em 0.45em; border-radius: 4px;
            font-family: 'SFMono-Regular', 'Consolas', 'Monaco', monospace;
            font-size: 0.88em; letter-spacing: 0;
        }

        .markdown-body .md-code-block {
            position: relative; margin: 0 0 1.2em 0;
            background: #1e1e2e; border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .markdown-body .md-code-lang {
            position: absolute; top: 0; right: 0;
            padding: 4px 10px; font-size: 11px; color: #9a9eb0;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 0 var(--radius-sm) 0 var(--radius-sm);
            text-transform: uppercase; letter-spacing: 0.5px;
            font-family: 'SFMono-Regular', 'Consolas', 'Monaco', monospace;
        }
        .markdown-body .md-code-block pre {
            margin: 0; padding: 16px 18px;
            overflow-x: auto; color: #e6e6f0;
            font-size: 13.5px; line-height: 1.6;
            font-family: 'SFMono-Regular', 'Consolas', 'Monaco', monospace;
            letter-spacing: 0;
        }
        .markdown-body .md-code-block pre code {
            background: none; padding: 0; color: inherit;
            font-family: inherit; font-size: inherit;
        }
        .markdown-body .md-code-block pre::-webkit-scrollbar { height: 6px; }
        .markdown-body .md-code-block pre::-webkit-scrollbar-track { background: transparent; }
        .markdown-body .md-code-block pre::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .markdown-body .md-table-wrap {
            margin: 0 0 1.2em 0; overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
        }
        .markdown-body table {
            width: 100%; border-collapse: collapse; font-size: 14.5px;
        }
        .markdown-body thead { background: #f8f9fc; }
        .markdown-body th {
            padding: 10px 14px; text-align: left;
            font-weight: 600; color: var(--paper-text);
            border-bottom: 1px solid var(--border-light);
        }
        .markdown-body td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--paper-text);
        }
        .markdown-body tr:last-child td { border-bottom: none; }
        .markdown-body tbody tr:hover { background: rgba(79, 110, 247, 0.03); }

        .markdown-body img.md-img {
            max-width: 100%; height: auto;
            border-radius: var(--radius-sm);
            margin: 0.3em 0;
        }

        /* ----- FOOTER ----- */
        .main-footer {
            flex-shrink: 0; padding: 10px 28px 14px 28px;
            background: transparent; text-align: right;
            font-size: 12.5px; color: #9a9eb0;
            user-select: none; letter-spacing: 0.3px; font-weight: 400;
        }
        .main-footer span {
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            padding: 4px 14px; border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* ----- MODAL ----- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #ffffff; max-width: 420px; width: 90%;
            padding: 32px 36px 28px 36px; border-radius: var(--radius);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.20);
            text-align: center;
            animation: modalSlide 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h3 {
            font-weight: 600; font-size: 20px; margin-bottom: 8px;
            color: var(--paper-text); letter-spacing: -0.3px;
        }
        .modal-box p {
            color: #5a5a72; font-size: 15px; margin-bottom: 24px; line-height: 1.6;
        }
        .modal-box input[type="text"] {
            width: 100%; padding: 11px 16px;
            border: 1.5px solid #e0e4ec; border-radius: var(--radius-sm);
            font-size: 15px; margin-bottom: 24px; outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            font-family: inherit; background: #f8f9fc; color: var(--paper-text);
        }
        .modal-box input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: #fff;
        }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-actions .btn {
            min-width: 100px; padding: 10px 0; font-size: 14px;
            border: none; border-radius: var(--radius-sm); font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            font-family: inherit; letter-spacing: 0.2px;
        }
        .modal-actions .btn:active { transform: scale(0.96); }
        .btn-modal-cancel { background: #f0f2f6; color: var(--paper-text); }
        .btn-modal-cancel:hover { background: #e4e7ee; }
        .btn-modal-danger { background: #dc2626; color: white; }
        .btn-modal-danger:hover { background: #b91c1c; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.30); }
        .btn-modal-primary { background: var(--accent); color: white; }
        .btn-modal-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 16px var(--accent-glow); }

        /* ----- SIDEBAR OVERLAY (mobile) ----- */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block; animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; left: 0;
                transform: translateX(-100%);
                height: 100vh; width: 280px; min-width: 280px;
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.12);
                transition: transform var(--transition);
                z-index: 100; border-right: none;
                border-radius: 0 16px 16px 0; height: 100%;
            }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: flex; }
            .sidebar-overlay.active { display: block; }
            .main-header { padding: 10px 16px; min-height: 54px; }
            .paper-wrapper { padding: 12px 14px 8px 14px; }
            .paper-textarea {

        @media (max-width: 450px) {

            .paper-textarea {
                padding: 14px 14px; font-size: 14px; line-height: 1.75;
            }
            .read-view {
                padding: 14px 14px; font-size: 14px; line-height: 1.75;
            }
            .markdown-body h1 { font-size: 1.4em; }
            .markdown-body h2 { font-size: 1.2em; }
            .markdown-body h3 { font-size: 1.1em; }
            .markdown-body .md-code-block pre { padding: 12px 14px; font-size: 12.5px; }
            .markdown-body th, .markdown-body td { padding: 7px 10px; font-size: 13px; }
            .main-header { padding: 6px 10px; min-height: 46px; gap: 6px; }
            .btn-icon { padding: 5px 6px; }
            .file-name-display { max-width: 90px; font-size: 12.5px; }
            .header-left { gap: 8px; }
            .modal-box { padding: 20px 14px 16px 14px; width: 95%; }
            .modal-box h3 { font-size: 18px; }
            .modal-box p { font-size: 14px; }
            .modal-actions .btn { min-width: 80px; font-size: 13px; padding: 9px 0; }
            .sidebar { width: 260px; min-width: 260px; }
            .sidebar-title { font-size: 15px; }
            .sidebar-logo { width: 30px; height: 30px; font-size: 15px; }
            /* Sembunyikan label toggle di layar sangat kecil */
            .view-toggle-btn span { display: none; }
            .view-toggle-btn { padding: 5px 7px; }
            .view-toggle { margin: 0 2px; }
        }

        /* ----- UTILITY ----- */
        .hidden { display: none !important; }
        .file-list-empty {
            color: var(--sidebar-text-dim); font-size: 13px;
            text-align: center; padding: 40px 16px; opacity: 0.6;
        }

        /* ===== FIX TABEL GLOBAL (scroll horizontal) ===== */
        .markdown-body .md-table-wrap {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
        }
        .markdown-body table {
            width: max-content;
            min-width: 100%;
        }
        .markdown-body th,
        .markdown-body td {
            white-space: nowrap;
        }

        /* ===== PRINT BUTTON HIDDEN DI MOBILE ===== */
        @media (max-width: 768px) {
            .print-btn { display: none !important; }
        }

        /* ===== PRINT CONTAINER (screen: hidden) ===== */
        #printContainer { display: none; }

        /* ===== PRINT STYLES ===== */
        @media print {
            @page {
                size: A4;
                margin: 18mm 15mm 18mm 15mm;
                /* Firefox: page number di margin bawah */
                @bottom-center {
                    content: "Halaman " counter(page) " / " counter(pages);
                    font-family: 'Inter', sans-serif;
                    font-size: 9pt;
                    color: #666;
                }
            }

            html, body {
                background: #fff !important;
                overflow: visible !important;
                height: auto !important;
                width: auto !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Sembunyikan UI aplikasi */
            .app,
            .sidebar,
            .sidebar-overlay,
            .main-header,
            .paper-wrapper,
            .main-footer,
            .modal-overlay,
            #fileInput,
            .print-btn { display: none !important; }

            /* Tampilkan konten print */
            #printContainer {
                display: block !important;
                width: 100%;
                color: #1a1a2e;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 11pt;
                line-height: 1.6;
            }

            /* Layout tabel untuk repeating footer */
            #printContainer table.print-layout {
                width: 100%;
                border-collapse: collapse;
            }
            #printContainer table.print-layout > tbody > tr > td,
            #printContainer table.print-layout > tfoot > tr > td {
                padding: 0;
                border: none;
                vertical-align: top;
            }

            #printContainer .print-footer-content {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 9pt;
                color: #666;
                padding: 8px 0 6px 0;
                border-top: 1px solid #ddd;
                margin-top: 12px;
            }
            #printContainer .print-filename {
                font-weight: 500;
                color: #333;
            }
            #printContainer .print-website {
                color: #4f6ef7;
                font-weight: 500;
            }

            /* Konten markdown */
            #printContainer .markdown-body { color: #1a1a2e; }

            #printContainer .markdown-body h1,
            #printContainer .markdown-body h2,
            #printContainer .markdown-body h3,
            #printContainer .markdown-body h4,
            #printContainer .markdown-body h5,
            #printContainer .markdown-body h6 {
                page-break-after: avoid;
                break-after: avoid;
                page-break-inside: avoid;
                break-inside: avoid;
                margin-top: 1.1em;
                margin-bottom: 0.5em;
                color: #1a1a2e;
            }
            #printContainer .markdown-body h1 {
                font-size: 18pt;
                border-bottom: 1px solid #ccc;
                padding-bottom: 0.2em;
            }
            #printContainer .markdown-body h2 {
                font-size: 15pt;
                border-bottom: 1px solid #eee;
                padding-bottom: 0.15em;
            }
            #printContainer .markdown-body h3 { font-size: 13pt; }
            #printContainer .markdown-body h4 { font-size: 11.5pt; }
            #printContainer .markdown-body p { margin: 0 0 0.7em 0; }

            #printContainer .markdown-body ul,
            #printContainer .markdown-body ol {
                margin: 0 0 0.7em 0;
                padding-left: 1.5em;
            }

            /* Anti page-break di tengah elemen */
            #printContainer .markdown-body pre,
            #printContainer .markdown-body blockquote,
            #printContainer .markdown-body .md-table-wrap,
            #printContainer .markdown-body .md-code-block,
            #printContainer .markdown-body img,
            #printContainer .markdown-body tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            /* Tabel: wrap & mengecil di kertas (bukan scroll) */
            #printContainer .markdown-body .md-table-wrap {
                overflow: visible;
                border: 1px solid #ccc;
                border-radius: 0;
            }
            #printContainer .markdown-body table {
                width: 100%;
                min-width: 0;
                font-size: 9pt;
                border-collapse: collapse;
            }
            #printContainer .markdown-body th,
            #printContainer .markdown-body td {
                white-space: normal;
                padding: 5px 8px;
                border: 1px solid #ccc;
                word-break: break-word;
                font-size: 9pt;
            }
            #printContainer .markdown-body th {
                background: #f0f0f0;
                font-weight: 600;
            }

            /* Code & blockquote: warna disederhanakan agar hemat tinta */
            #printContainer .markdown-body .md-code-block {
                background: #f5f5f7;
                border: 1px solid #ddd;
            }
            #printContainer .markdown-body .md-code-block pre {
                color: #1a1a2e;
                font-size: 9pt;
                white-space: pre-wrap;
                word-break: break-word;
                padding: 10px 12px;
            }
            #printContainer .markdown-body .md-code-lang {
                background: #e5e5e5;
                color: #555;
            }
            #printContainer .markdown-body code.md-inline-code {
                background: #f0f0f0;
                color: #d63384;
                border: 1px solid #e0e0e0;
            }
            #printContainer .markdown-body a {
                color: #1a1a2e;
                text-decoration: underline;
                border-bottom: none;
            }
            #printContainer .markdown-body blockquote {
                border-left: 3px solid #999;
                background: #f8f8f8;
                color: #333;
                padding: 0.4em 1em;
                border-radius: 0;
            }
            #printContainer .markdown-body hr {
                border: none;
                border-top: 1px solid #ccc;
                margin: 1em 0;
            }
        }

        /* ===== MODE BACA — DESKTOP (default): kolom > 4 menambah 25% ===== */
        /* 1–4 kolom → 100%; 5 → 125%; 6 → 150%; 7 → 175%; dst.
           max(100%, ...) meng-clamp kolom 1–4 yang calc-nya negatif. */
        .read-view .markdown-body table {
            table-layout: fixed;
            width: max(100%, calc(100% + (var(--cols, 2) - 4) * 25%));
            min-width: 0;
        }

        .read-view .markdown-body th,
        .read-view .markdown-body td {
            white-space: normal;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* ===== MODE BACA — PONSEL (≤768px): tiap kolom = 50% parent ===== */
        /* 1 kolom → 100% (clamp); 2 → 100%; 3 → 150%; 4 → 200%; N → N × 50%.
           Blok ini SENGAJA di bawah agar menimpa aturan desktop di atas. */
        @media (max-width: 768px) {
            .read-view .markdown-body table {
                width: max(100%, calc(var(--cols, 2) * 50%));
            }
        }

    </style>
</head>

            'use strict';

            // ----- DOM refs -----
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            const fileListContainer = document.getElementById('fileListContainer');
