<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="description" content="Bismillah" />
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f6ef7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>" />
    <title>Direct Link Generator</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           RESET & GLOBAL (SAMA PERSIS DENGAN NOTE.HTML)
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6;
            overflow: hidden;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --sidebar-bg: #f4f6fa;
            --sidebar-hover: #e9ecf2;
            --sidebar-active: #dde1e9;
            --sidebar-border: #dce0e8;
            --sidebar-text: #1a1a2e;
            --sidebar-text-dim: #6b7280;
            --accent: #4f6ef7;
            --accent-hover: #3a55d9;
            --accent-glow: rgba(79, 110, 247, 0.25);
            --main-bg: #f0f2f6;
            --paper-bg: #ffffff;
            --paper-text: #1a1a2e;
            --header-bg: rgba(255, 255, 255, 0.72);
            --border-light: #e6e9f0;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --toast-success: #22c55e;
            --toast-error: #ef4444;
        }

        [data-theme="dark"] {
            --sidebar-bg: #18182a;
            --sidebar-hover: #22223a;
            --sidebar-active: #2a2a48;
            --sidebar-border: #2a2a48;
            --sidebar-text: #f0f0f8;
            --sidebar-text-dim: #8a8ea0;
            --main-bg: #0f0f1a;
            --paper-bg: #1e1e32;
            --paper-text: #f0f0f8;
            --header-bg: rgba(20, 20, 40, 0.80);
            --border-light: #2a2a48;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.40);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.50);
            --accent: #6a84ff;
            --accent-hover: #5a74ef;
            --accent-glow: rgba(106, 132, 255, 0.30);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8ccd8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8aec0;
        }

        /* ============================================================
           APP LAYOUT
           ============================================================ */
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            transition: transform var(--transition), min-width var(--transition);
            z-index: 100;
            flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            position: relative;
        }

        .sidebar-header {
            padding: 22px 20px 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .sidebar-logo {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 16px var(--accent-glow);
			transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
			text-decoration: none;
        }

		.sidebar-logo:hover {
			transform: scale(1.08) rotate(2deg);
			box-shadow: 0 6px 24px var(--accent-glow);
			background: var(--accent-hover);
		}

        .sidebar-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--sidebar-text);
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .sidebar-title span {
            color: var(--accent);
        }

        /* ----- MENU NAVIGASI (seperti di note.html) ----- */
        .sidebar-nav {
            padding: 14px 16px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-nav {
            display: flex;
            flex: 1;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.04);
            color: var(--sidebar-text);
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            width: 100%;
            justify-content: center;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .btn-nav:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .btn-nav:active {
            transform: scale(0.96);
        }
        .btn-nav.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-nav.active svg {
            opacity: 1;
        }
        .btn-nav svg {
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* ----- KONTEN SIDEBAR (daftar riwayat) ----- */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 20px 10px;
            position: relative;
            z-index: 1;
        }

        .history-item-sidebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), transform 0.12s;
            color: var(--sidebar-text);
            gap: 8px;
        }
        .history-item-sidebar:hover {
            background: var(--sidebar-hover);
        }
        .history-item-sidebar .h-name {
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.1px;
        }
        .history-item-sidebar .h-time {
            font-size: 11px;
            color: var(--sidebar-text-dim);
            flex-shrink: 0;
        }
        .history-item-sidebar .h-menu {
            flex-shrink: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            color: var(--sidebar-text-dim);
            transition: background var(--transition), color var(--transition);
        }
        .history-item-sidebar .h-menu:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--sidebar-text);
        }

        .sidebar-empty {
            color: var(--sidebar-text-dim);
            font-size: 13px;
            text-align: center;
            padding: 40px 16px;
            opacity: 0.6;
        }

        /* ----- DROPDOWN (sama dengan note.html) ----- */
        .dropdown {
            position: absolute;
            right: 0;
            top: 110%;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            min-width: 190px;
            padding: 6px 0;
            display: none;
            z-index: 200;
            animation: dropFade 0.18s ease-out;
            border: 1px solid var(--sidebar-border);
        }
        .dropdown.open {
            display: block;
        }
        @keyframes dropFade {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(-8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            font-size: 13px;
            color: var(--sidebar-text);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background 0.12s;
            border-radius: 0;
            font-family: inherit;
            letter-spacing: 0.1px;
        }
        .dropdown-item:hover {
            background: var(--sidebar-hover);
        }
        .dropdown-item:first-child {
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .dropdown-item:last-child {
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .dropdown-item.danger {
            color: #dc2626;
        }
        .dropdown-item.danger:hover {
            background: #fde8e8;
        }
        .dropdown-item svg {
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* ----- FOOTER SIDEBAR (sosial media) ----- */
        .sidebar-footer {
            flex-shrink: 0;
            padding: 12px 16px 16px 16px;
            border-top: 1px solid var(--sidebar-border);
            display: flex;
            justify-content: center;
            gap: 14px;
        }
        .sidebar-footer a {
            color: var(--sidebar-text-dim);
            font-size: 20px;
            transition: color var(--transition), transform 0.15s;
            text-decoration: none;
        }
        .sidebar-footer a:hover {
            color: var(--accent);
            transform: translateY(-2px) scale(1.1);
        }

        /* ===== AREA UTAMA ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            background: var(--main-bg);
            position: relative;
        }

        /* ----- HEADER / TOOLBAR ----- */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            min-height: 60px;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--paper-text);
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--paper-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 320px;
            letter-spacing: -0.2px;
        }
        .header-title .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 10px;
            vertical-align: middle;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #5a5a72;
            transition: background var(--transition), color var(--transition), transform 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--paper-text);
        }
        .btn-icon:active {
            transform: scale(0.92);
        }
        .btn-icon-primary:hover {
            background: rgba(79, 110, 247, 0.10);
            color: var(--accent);
        }

        /* ----- PAPER WRAPPER (KONTEN UTAMA) ----- */
        .paper-wrapper {
            flex: 1;
            min-height: 0;
            padding: 24px 32px 16px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- KARTU KONVERTER --- */
        .converter-card {
            background: var(--paper-bg);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: border var(--transition), box-shadow var(--transition);
        }
        .converter-card:hover {
            box-shadow: var(--shadow-md);
        }

        .converter-card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--paper-text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .converter-card .card-title i {
            color: var(--accent);
            font-size: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-row .input-field {
            flex: 1;
            min-width: 200px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-light);
            background: var(--main-bg);
            color: var(--paper-text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
            resize: vertical;
            min-height: 60px;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .input-field::placeholder {
            color: var(--sidebar-text-dim);
            opacity: 0.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            height: 44px;
        }
        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
        }
        .btn-outline:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-ghost {
            background: var(--sidebar-hover);
            color: var(--sidebar-text);
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover {
            background: var(--sidebar-active);
        }

        .btn-danger-ghost {
            background: transparent;
            color: var(--toast-error);
            border: 1px solid var(--toast-error);
        }
        .btn-danger-ghost:hover {
            background: var(--toast-error);
            color: #fff;
        }

        .btn-sm {
            height: 34px;
            padding: 4px 14px;
            font-size: 12px;
        }

        /* Hasil konversi */
        .result-box {
            margin-top: 16px;
            padding: 16px 18px;
            background: var(--main-bg);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--accent);
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .result-box.visible {
            display: flex;
        }

        .result-box .result-url {
            font-size: 13px;
            word-break: break-all;
            color: var(--paper-text);
            background: var(--paper-bg);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            font-family: 'Inter', monospace;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .file-info {
            font-size: 13px;
            color: var(--sidebar-text-dim);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 6px 0 2px 0;
        }
        .file-info span {
            background: var(--paper-bg);
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }
        .file-info .warning {
            color: #f59e0b;
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
        }

        /* ----- KONTEN RIWAYAT (di area utama) ----- */
        .history-list-main {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .history-item-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: var(--main-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            flex-wrap: wrap;
        }
        .history-item-main .h-left {
            flex: 1;
            min-width: 150px;
        }
        .history-item-main .h-left .h-original {
            font-size: 12px;
            color: var(--sidebar-text-dim);
            word-break: break-all;
        }
        .history-item-main .h-left .h-direct {
            font-size: 12px;
            color: var(--accent);
            word-break: break-all;
            font-weight: 500;
        }
        .history-item-main .h-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .history-empty {
            color: var(--sidebar-text-dim);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
            opacity: 0.6;
        }
        .history-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ----- TOAST NOTIFICATION ----- */
        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--paper-bg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            color: var(--paper-text);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .toast i {
            font-size: 18px;
        }
        .toast.success i {
            color: var(--toast-success);
        }
        .toast.error i {
            color: var(--toast-error);
        }
        .toast.info i {
            color: var(--accent);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- FOOTER (bawah main) ----- */
        .main-footer {
            flex-shrink: 0;
            padding: 10px 28px 14px 28px;
            background: transparent;
            text-align: right;
            font-size: 12.5px;
            color: #9a9eb0;
            user-select: none;
            letter-spacing: 0.3px;
            font-weight: 400;
        }
        .main-footer span {
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* ===== SIDEBAR OVERLAY (mobile) ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                height: 100vh;
                width: 280px;
                min-width: 280px;
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.12);
                transition: transform var(--transition);
                z-index: 100;
                border-right: none;
                border-radius: 0 16px 16px 0;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger {
                display: flex;
            }
            .sidebar-overlay.active {
                display: block;
            }
            .main-header {
                padding: 10px 16px;
                min-height: 54px;
            }
            .paper-wrapper {
                padding: 12px 14px 8px 14px;
                gap: 14px;
            }
            .header-title {
                max-width: 130px;
                font-size: 14px;
            }
            .header-title .dot {
                width: 6px;
                height: 6px;
                margin-right: 6px;
            }
            .main-footer {
                padding: 8px 16px 12px 16px;
                font-size: 11.5px;
            }
            .converter-card {
                padding: 16px 16px;
            }
            .input-row {
                flex-direction: column;
            }
            .input-row .input-field {
                min-width: unset;
            }
            .result-actions {
                flex-direction: column;
            }
            .result-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .history-item-main {
                flex-direction: column;
                align-items: stretch;
            }
            .history-item-main .h-actions {
                justify-content: flex-end;
            }
            .toast-container {
                right: 12px;
                left: 12px;
                max-width: unset;
                bottom: 16px;
            }
        }

        @media (max-width: 450px) {
            .paper-wrapper {
                padding: 8px 8px 4px 8px;
                gap: 10px;
            }
            .main-header {
                padding: 6px 10px;
                min-height: 46px;
            }
            .btn-icon {
                padding: 5px 6px;
                font-size: 17px;
            }
            .header-title {
                max-width: 90px;
                font-size: 12.5px;
            }
            .header-left {
                gap: 8px;
            }
            .sidebar {
                width: 260px;
                min-width: 260px;
            }
            .converter-card {
                padding: 12px 12px;
            }
            .converter-card .card-title {
                font-size: 13px;
            }
            .btn {
                font-size: 12px;
                height: 38px;
                padding: 6px 14px;
            }
        }

        .hidden {
            display: none !important;
        }
        .mt-8 {
            margin-top: 8px;
        }

        /* ===== MODAL (sama dengan note.html) ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            max-width: 420px;
            width: 90%;
            padding: 32px 36px 28px 36px;
            border-radius: var(--radius);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.20);
            text-align: center;
            animation: modalSlide 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box h3 {
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--paper-text);
            letter-spacing: -0.3px;
        }
        .modal-box p {
            color: #5a5a72;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .modal-box input[type="text"] {
            width: 100%;
            padding: 11px 16px;
            border: 1.5px solid #e0e4ec;
            border-radius: var(--radius-sm);
            font-size: 15px;
            margin-bottom: 24px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            font-family: inherit;
            background: #f8f9fc;
            color: var(--paper-text);
        }
        .modal-box input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-actions .btn {
            min-width: 100px;
            padding: 10px 0;
            font-size: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .modal-actions .btn:active {
            transform: scale(0.96);
        }

        .btn-modal-cancel {
            background: #f0f2f6;
            color: var(--paper-text);
        }
        .btn-modal-cancel:hover {
            background: #e4e7ee;
        }

        .btn-modal-danger {
            background: #dc2626;
            color: white;
        }
        .btn-modal-danger:hover {
            background: #b91c1c;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.30);
        }

        .btn-modal-primary {
            background: var(--accent);
            color: white;
        }
        .btn-modal-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- SIDEBAR OVERLAY (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo" aria-label="Home">
					<i class="fa-solid fa-house-chimney"></i>
				</a>
                <div class="sidebar-title">Muthinx <span>Drive</span></div>
            </div>

            <!-- NAVIGASI 2 MENU -->
            <div class="sidebar-nav">
                <button class="btn-nav active" id="navConverter" data-view="converter">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                    Konverter
                </button>
                <button class="btn-nav" id="navHistory" data-view="history">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    Riwayat
                </button>
            </div>

            <!-- KONTEN SIDEBAR (untuk riwayat) -->
            <div class="sidebar-content" id="sidebarContent">
                <!-- akan diisi oleh JS dengan daftar riwayat -->
            </div>

            <!-- FOOTER SIDEBAR (sosial media) -->
            <div class="sidebar-footer">
                <a href="#" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" target="_blank" aria-label="Tiktok"><i class="fab fa-tiktok"></i></a>
                <a href="#" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </aside>

        <!-- ===== AREA UTAMA ===== -->
        <main class="main">
            <header class="main-header">
                <div class="header-left">
                    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="header-title" id="headerTitle">
                        <span class="dot"></span>Konverter
                    </span>
                </div>
                <div class="header-right">
                    <button class="btn-icon btn-icon-primary" id="themeToggle" aria-label="Toggle tema">
                        <i class="fas fa-sun" id="themeIcon"></i>
                    </button>
                </div>
            </header>

            <div class="paper-wrapper" id="paperWrapper">
                <!-- VIEW KONVERTER -->
                <div id="viewConverter">
                    <div class="converter-card">
                        <div class="card-title">
                            <i class="fa-brands fa-google-drive"></i>
                            Konversi Link Google Drive
                        </div>

                        <div class="input-group">
                            <div class="input-row">
                                <div class="input-field">
                                    <textarea class="input-field" id="driveInput" placeholder="Tempelkan link Google Drive di sini…&#10;Contoh: https://drive.google.com/file/d/xxx/view"></textarea>
                                </div>
                            </div>
                            <div class="input-row">
                                <button class="btn btn-ghost" id="pasteBtn"><i class="fas fa-paste"></i> Paste</button>
                                <button class="btn btn-primary" id="convertBtn"><i class="fas fa-arrow-right"></i> Konversi</button>
                                <button class="btn btn-ghost" id="clearBtn"><i class="fas fa-eraser"></i> Bersihkan</button>
                            </div>
                        </div>

                        <!-- Hasil -->
                        <div class="result-box" id="resultBox">
                            <div class="file-info" id="fileInfo">
                                <span id="fileName"><i class="far fa-file"></i> Nama: Tidak diketahui</span>
                                <span class="warning" id="largeFileWarning" style="display:none;"><i class="fas fa-triangle-exclamation"></i> File > 100 MB (mungkin butuh konfirmasi)</span>
                            </div>
                            <div class="result-url" id="resultUrl">-</div>
                            <div class="result-actions">
                                <button class="btn btn-outline btn-sm" id="copyBtn"><i class="fas fa-copy"></i> Salin Link</button>
                                <button class="btn btn-primary btn-sm" id="openBtn"><i class="fas fa-external-link-alt"></i> Buka di Tab Baru</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- VIEW RIWAYAT -->
                <div id="viewHistory" class="hidden">
                    <div class="converter-card">
                        <div class="card-title">
                            <i class="fas fa-clock-rotate-left"></i>
                            Riwayat Konversi
                        </div>
                        <div class="history-header-main">
                            <span style="font-size:13px; color:var(--sidebar-text-dim);" id="historyCountMain">0 item</span>
                            <div style="display:flex; gap:8px;">
                                <button class="btn btn-ghost btn-sm" id="clearHistoryBtnMain"><i class="fas fa-trash-can"></i> Hapus Semua</button>
                            </div>
                        </div>
                        <div class="history-list-main" id="historyListMain">
                            <div class="history-empty">Belum ada riwayat konversi.</div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="main-footer">
                <span id="footerInfo">Muthinx Drive Converter · 100% client-side</span>
            </footer>
        </main>
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h3 id="modalTitle">⚠️ Hapus riwayat?</h3>
            <p id="modalMessage">Data riwayat akan dihapus permanen.</p>
            <div id="modalExtra" style="display:none;">
                <input type="text" id="modalInput" placeholder="Nama baru..." />
            </div>
            <div class="modal-actions" id="modalActions">
                <button class="btn btn-modal-cancel" id="modalCancelBtn">Batal</button>
                <button class="btn btn-modal-danger" id="modalConfirmBtn">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM REFS
            // ============================================================
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const headerTitle = document.getElementById('headerTitle');

            const navConverter = document.getElementById('navConverter');
            const navHistory = document.getElementById('navHistory');
            const viewConverter = document.getElementById('viewConverter');
            const viewHistory = document.getElementById('viewHistory');
            const sidebarContent = document.getElementById('sidebarContent');

            const driveInput = document.getElementById('driveInput');
            const convertBtn = document.getElementById('convertBtn');
            const pasteBtn = document.getElementById('pasteBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resultBox = document.getElementById('resultBox');
            const resultUrl = document.getElementById('resultUrl');
            const copyBtn = document.getElementById('copyBtn');
            const openBtn = document.getElementById('openBtn');
            const fileName = document.getElementById('fileName');
            const largeFileWarning = document.getElementById('largeFileWarning');

            const historyListMain = document.getElementById('historyListMain');
            const historyCountMain = document.getElementById('historyCountMain');
            const clearHistoryBtnMain = document.getElementById('clearHistoryBtnMain');

            const toastContainer = document.getElementById('toastContainer');

            // Modal
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalExtra = document.getElementById('modalExtra');
            const modalInput = document.getElementById('modalInput');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');

            const STORAGE_KEY = 'muthinx_drive_history';

            // ============================================================
            // TEMA (sinkron dengan portal)
            // ============================================================
            function getStoredTheme() {
                return localStorage.getItem('muthinx-theme') || 'light';
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('muthinx-theme', theme);
                themeIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            }

            setTheme(getStoredTheme());
            themeToggle.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // ============================================================
            // SIDEBAR TOGGLE (mobile)
            // ============================================================
            function toggleSidebar(open) {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('active', open);
                }
            }

            hamburger.addEventListener('click', function() {
                toggleSidebar(!sidebar.classList.contains('open'));
            });
            overlay.addEventListener('click', function() {
                toggleSidebar(false);
            });
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    const isSidebar = e.target.closest('.sidebar');
                    const isHamburger = e.target.closest('.hamburger');
                    if (!isSidebar && !isHamburger && sidebar.classList.contains('open')) {
                        toggleSidebar(false);
                    }
                }
            });

            // ============================================================
            // TOAST NOTIFICATION
            // ============================================================
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const iconMap = {
                    success: 'fa-circle-check',
                    error: 'fa-circle-xmark',
                    info: 'fa-circle-info'
                };
                toast.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'opacity 0.3s, transform 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            // ============================================================
            // INTI: EKSTRAK ID GOOGLE DRIVE
            // ============================================================
            function extractDriveId(url) {
                if (!url) return null;
                let match;
                match = url.match(/\/file\/d\/([^\/\?]+)/);
                if (match) return match[1];
                match = url.match(/[?&]id=([^&]+)/);
                if (match) return match[1];
                match = url.match(/uc\?id=([^&]+)/);
                if (match) return match[1];
                if (url.includes('/folders/')) {
                    return null;
                }
                match = url.match(/([a-zA-Z0-9_-]{28,33})/);
                if (match) return match[1];
                return null;
            }

            function buildDirectLink(id) {
                return `https://drive.usercontent.google.com/download?id=${id}&export=download`;
            }

            // ============================================================
            // KONVERSI UTAMA
            // ============================================================
            function performConversion() {
                const raw = driveInput.value.trim();
                if (!raw) {
                    showToast('Masukkan link Google Drive terlebih dahulu.', 'error');
                    return;
                }

                const id = extractDriveId(raw);
                if (!id) {
                    showToast('Link tidak dikenali. Pastikan link file Google Drive yang valid.', 'error');
                    resultBox.classList.remove('visible');
                    return;
                }

                const direct = buildDirectLink(id);
                resultUrl.textContent = direct;
                resultBox.classList.add('visible');

                let name = 'Tidak diketahui';
                try {
                    const urlObj = new URL(raw);
                    const pathParts = urlObj.pathname.split('/');
                    const lastPart = pathParts[pathParts.length - 1];
                    if (lastPart && lastPart.includes('.')) {
                        name = decodeURIComponent(lastPart.split('?')[0]);
                    }
                } catch (_) { /* ignore */ }

                fileName.innerHTML = `<i class="far fa-file"></i> Nama: ${name} (ID: ${id.substring(0,8)}…)`;
                largeFileWarning.style.display = 'inline-flex';

                saveHistory(raw, direct, id, name);
                showToast('Link berhasil dikonversi! ✅', 'success');

                // Jika sedang di view riwayat, pindah ke konverter agar hasil terlihat
                if (!viewConverter.classList.contains('hidden')) {
                    // sudah di konverter
                } else {
                    // pindah ke konverter
                    switchView('converter');
                }
            }

            // ============================================================
            // RIWAYAT (localStorage)
            // ============================================================
            function getHistory() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                } catch (_) {
                    return [];
                }
            }

            function saveHistory(original, direct, id, name) {
                const history = getHistory();
                const entry = {
                    original,
                    direct,
                    id,
                    name: name || 'Tidak diketahui',
                    timestamp: Date.now()
                };
                const exists = history.some(h => h.direct === direct);
                if (!exists) {
                    history.unshift(entry);
                    if (history.length > 50) history.pop();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                }
                renderAllHistory();
            }

            function deleteHistoryItem(index) {
                const history = getHistory();
                if (index >= 0 && index < history.length) {
                    history.splice(index, 1);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                    renderAllHistory();
                    showToast('Riwayat dihapus.', 'info');
                }
            }

            function clearAllHistory() {
                if (getHistory().length === 0) {
                    showToast('Riwayat sudah kosong.', 'info');
                    return;
                }
                showModal(
                    '⚠️ Hapus semua riwayat?',
                    'Semua data riwayat akan dihapus permanen.',
                    'Ya, Hapus Semua',
                    'danger'
                ).then(confirmed => {
                    if (confirmed) {
                        localStorage.removeItem(STORAGE_KEY);
                        renderAllHistory();
                        showToast('Semua riwayat dihapus.', 'success');
                    }
                });
            }

            function renderAllHistory() {
                renderHistoryMain();
                renderHistorySidebar();
            }

            function renderHistoryMain() {
                const history = getHistory();
                historyCountMain.textContent = `${history.length} item`;

                if (history.length === 0) {
                    historyListMain.innerHTML = `<div class="history-empty">Belum ada riwayat konversi.</div>`;
                    return;
                }

                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', {
                        hour: '2-digit',
                        minute: '2-digit',
                        day: 'numeric',
                        month: 'short',
                        year: 'numeric'
                    });
                    html += `
                                <div class="history-item-main">
                                    <div class="h-left">
                                        <div class="h-original"><i class="fas fa-link"></i> ${item.original.substring(0, 60)}${item.original.length > 60 ? '…' : ''}</div>
                                        <div class="h-direct"><i class="fas fa-arrow-right"></i> ${item.direct.substring(0, 60)}${item.direct.length > 60 ? '…' : ''}</div>
                                        <div style="font-size:11px;color:var(--sidebar-text-dim);margin-top:4px;">${time} · ${item.name}</div>
                                    </div>
                                    <div class="h-actions">
                                        <button class="btn btn-outline btn-sm" onclick="window.open('${item.direct}', '_blank')"><i class="fas fa-external-link-alt"></i></button>
                                        <button class="btn btn-outline btn-sm" onclick="copyText('${item.direct}')"><i class="fas fa-copy"></i></button>
                                        <button class="btn btn-danger-ghost btn-sm" onclick="deleteHistoryItem(${index})"><i class="fas fa-trash-can"></i></button>
                                    </div>
                                </div>
                            `;
                });
                historyListMain.innerHTML = html;
            }

            function renderHistorySidebar() {
                const history = getHistory();
                if (history.length === 0) {
                    sidebarContent.innerHTML = `<div class="sidebar-empty">Belum ada riwayat</div>`;
                    return;
                }

                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    html += `
                                <div class="history-item-sidebar" data-index="${index}">
                                    <span class="h-name">${item.name}</span>
                                    <span class="h-time">${time}</span>
                                    <button class="h-menu" data-index="${index}" aria-label="Menu riwayat">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="5" r="1.5" />
                                            <circle cx="12" cy="12" r="1.5" />
                                            <circle cx="12" cy="19" r="1.5" />
                                        </svg>
                                    </button>
                                    <div class="dropdown" data-index="${index}">
                                        <button class="dropdown-item" onclick="window.open('${item.direct}', '_blank')">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                            Buka Link
                                        </button>
                                        <button class="dropdown-item" onclick="copyText('${item.direct}')">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                            Salin Link
                                        </button>
                                        <button class="dropdown-item danger" onclick="deleteHistoryItem(${index})">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                            Hapus
                                        </button>
                                    </div>
                                </div>
                            `;
                });
                sidebarContent.innerHTML = html;

                // Event untuk menu dropdown di sidebar
                document.querySelectorAll('.history-item-sidebar .h-menu').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const parent = this.closest('.history-item-sidebar');
                        const dropdown = parent.querySelector('.dropdown');
                        if (!dropdown) return;
                        // Tutup semua dropdown lain
                        document.querySelectorAll('.dropdown.open').forEach(d => d !== dropdown && d.classList
                            .remove('open'));
                        dropdown.classList.toggle('open');
                    });
                });

                // Klik item untuk beralih ke view converter dan isi input
                document.querySelectorAll('.history-item-sidebar').forEach(item => {
                    item.addEventListener('click', function(e) {
                        if (e.target.closest('.h-menu') || e.target.closest('.dropdown')) return;
                        const idx = parseInt(this.dataset.index);
                        const history = getHistory();
                        if (history[idx]) {
                            driveInput.value = history[idx].original;
                            // Pindah ke converter dan konversi otomatis
                            switchView('converter');
                            performConversion();
                            if (window.innerWidth <= 768) toggleSidebar(false);
                        }
                    });
                });

                // Tutup dropdown saat klik di luar
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.h-menu') && !e.target.closest('.dropdown')) {
                        document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
                    }
                });
            }

            // ============================================================
            // COPY KE CLIPBOARD
            // ============================================================
            function copyText(text) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('Link disalin ke clipboard! 📋', 'success');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('Link disalin ke clipboard! 📋', 'success');
                } catch (_) {
                    showToast('Gagal menyalin.', 'error');
                }
                document.body.removeChild(ta);
            }

            // ============================================================
            // SWITCH VIEW (Konverter / Riwayat)
            // ============================================================
            function switchView(view) {
                if (view === 'converter') {
                    viewConverter.classList.remove('hidden');
                    viewHistory.classList.add('hidden');
                    navConverter.classList.add('active');
                    navHistory.classList.remove('active');
                    headerTitle.innerHTML = `<span class="dot"></span>Konverter`;
                } else {
                    viewConverter.classList.add('hidden');
                    viewHistory.classList.remove('hidden');
                    navHistory.classList.add('active');
                    navConverter.classList.remove('active');
                    headerTitle.innerHTML = `<span class="dot"></span>Riwayat`;
                    renderHistoryMain(); // refresh
                }
                // Tutup sidebar di mobile
                if (window.innerWidth <= 768) toggleSidebar(false);
            }

            navConverter.addEventListener('click', function() {
                switchView('converter');
            });
            navHistory.addEventListener('click', function() {
                switchView('history');
            });

            // ============================================================
            // MODAL SYSTEM (sama dengan note.html)
            // ============================================================
            let modalResolve = null;

            function showModal(title, message, confirmLabel = 'OK', type = 'primary', showInput = false, inputValue = '') {
                return new Promise((resolve) => {
                    modalTitle.textContent = title;
                    modalMessage.textContent = message;
                    modalExtra.style.display = showInput ? 'block' : 'none';
                    if (showInput) {
                        modalInput.value = inputValue || '';
                        modalInput.focus();
                        modalInput.select();
                    }
                    const isDanger = (type === 'danger');
                    modalConfirmBtn.className = 'btn ' + (isDanger ? 'btn-modal-danger' : 'btn-modal-primary');
                    modalConfirmBtn.textContent = confirmLabel;
                    modalCancelBtn.textContent = 'Batal';

                    modalOverlay.classList.add('active');
                    modalResolve = resolve;
                });
            }

            modalCancelBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) {
                    const showInput = modalExtra.style.display !== 'none';
                    if (showInput) {
                        modalResolve(null);
                    } else {
                        modalResolve(false);
                    }
                    modalResolve = null;
                }
            });

            modalConfirmBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) {
                    const showInput = modalExtra.style.display !== 'none';
                    if (showInput) {
                        modalResolve(modalInput.value);
                    } else {
                        modalResolve(true);
                    }
                    modalResolve = null;
                }
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) {
                        const showInput = modalExtra.style.display !== 'none';
                        if (showInput) {
                            modalResolve(null);
                        } else {
                            modalResolve(false);
                        }
                        modalResolve = null;
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) {
                        const showInput = modalExtra.style.display !== 'none';
                        if (showInput) {
                            modalResolve(null);
                        } else {
                            modalResolve(false);
                        }
                        modalResolve = null;
                    }
                }
                if (e.key === 'Enter' && modalOverlay.classList.contains('active') && modalExtra.style.display !==
                    'none') {
                    modalConfirmBtn.click();
                }
            });

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            convertBtn.addEventListener('click', performConversion);

            driveInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    performConversion();
                }
            });

            pasteBtn.addEventListener('click', async function() {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        driveInput.value = text;
                        showToast('Link ditempel dari clipboard.', 'info');
                    }
                } catch (_) {
                    showToast('Gagal mengakses clipboard. Tempel manual (Ctrl+V).', 'error');
                }
            });

            clearBtn.addEventListener('click', function() {
                driveInput.value = '';
                resultBox.classList.remove('visible');
                showToast('Input dibersihkan.', 'info');
            });

            copyBtn.addEventListener('click', function() {
                const url = resultUrl.textContent;
                if (url && url !== '-') {
                    copyText(url);
                } else {
                    showToast('Tidak ada link untuk disalin.', 'error');
                }
            });

            openBtn.addEventListener('click', function() {
                const url = resultUrl.textContent;
                if (url && url !== '-') {
                    window.open(url, '_blank');
                } else {
                    showToast('Tidak ada link untuk dibuka.', 'error');
                }
            });

            clearHistoryBtnMain.addEventListener('click', clearAllHistory);

            // Ekspos ke global
            window.deleteHistoryItem = deleteHistoryItem;
            window.copyText = copyText;

            // ============================================================
            // INISIALISASI
            // ============================================================
            renderAllHistory();
            switchView('converter');

            // Set sosial media
            const socialLinks = document.querySelectorAll('.sidebar-footer a');
            if (socialLinks.length >= 4) {
					socialLinks[0].href = 'https://instagram.com/salimmuthinx';
                    socialLinks[1].href = 'https://facebook.com/muthinx';
                    socialLinks[2].href = 'https://tiktok.com/@bengkel.kangacul';
                    socialLinks[3].href = 'https://github.com/muthinx';
                }

            console.log('🚀 Muthinx Drive Converter siap!');
            console.log('📂 Riwayat:', getHistory().length, 'item');

            // Jika ada parameter ?url=
            const params = new URLSearchParams(window.location.search);
            const prefill = params.get('url');
            if (prefill) {
                driveInput.value = prefill;
                performConversion();
            }

        })();
    </script>

</body>
