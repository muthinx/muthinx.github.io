<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Bismillah" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f6ef7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>" />
    <title>Tank War</title>
    <style>
        /* ============================================================
           RESET & GLOBAL (SAMA PERSIS note.html)
           ============================================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6; overflow: hidden; color: #1a1a2e;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --sidebar-bg: #f4f6fa;
            --sidebar-hover: #e9ecf2;
            --sidebar-active: #dde1e9;
            --sidebar-border: #dce0e8;
            --sidebar-text: #1a1a2e;
            --sidebar-text-dim: #6b7280;
            --accent: #4f6ef7;
            --accent-hover: #3a55d9;
            --accent-glow: rgba(79, 110, 247, 0.25);
            --main-bg: #f0f2f6;
            --paper-bg: #ffffff;
            --paper-text: #1a1a2e;
            --header-bg: rgba(255, 255, 255, 0.72);
            --border-light: #e6e9f0;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --toast-success: #22c55e;
            --toast-error: #ef4444;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c8ccd8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8aec0; }

        /* ===== LAYOUT ===== */
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px; min-width: 280px;
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            height: 100%; overflow: hidden;
            transition: transform var(--transition), min-width var(--transition);
            z-index: 100; flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            position: relative;
        }

        .sidebar-header {
            padding: 22px 20px 14px 20px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0; position: relative; z-index: 1;
        }

        .sidebar-logo {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            background: var(--accent); border-radius: var(--radius-sm);
            color: white;
            box-shadow: 0 4px 16px var(--accent-glow);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-decoration: none;
        }
        .sidebar-logo svg { width: 20px; height: 20px; }
        .sidebar-logo:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 6px 24px var(--accent-glow);
            background: var(--accent-hover);
        }

        .sidebar-title {
            font-size: 17px; font-weight: 600;
            color: var(--sidebar-text);
            letter-spacing: -0.2px; white-space: nowrap;
        }
        .sidebar-title span { color: var(--accent); }

        /* ----- SIDEBAR ACTIONS ----- */
        .sidebar-actions {
            padding: 14px 16px;
            display: flex; flex-direction: row; gap: 8px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0; position: relative; z-index: 1;
        }

        .btn-sidebar {
            display: flex; flex: 1; align-items: center; gap: 8px;
            padding: 9px 12px; border: none;
            border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.04);
            color: var(--sidebar-text);
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            width: 100%; justify-content: center;
            font-family: inherit; letter-spacing: 0.2px;
        }
        .btn-sidebar:hover { background: rgba(0, 0, 0, 0.08); }
        .btn-sidebar:active { transform: scale(0.96); }
        .btn-sidebar svg { flex-shrink: 0; opacity: 0.7; }

        .btn-sidebar-primary {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-sidebar-primary:hover {
            background: var(--accent-hover); color: #fff;
            box-shadow: 0 6px 24px var(--accent-glow);
        }
        .btn-sidebar-primary svg { opacity: 1; }

        /* ----- DAFTAR RIWAYAT DI SIDEBAR ----- */
        .file-list-container {
            flex: 1; overflow-y: auto;
            padding: 8px 10px 20px 10px;
            position: relative; z-index: 1;
        }
        .file-list-container::-webkit-scrollbar { width: 4px; }
        .file-list-container::-webkit-scrollbar-thumb { background: #c8ccd8; border-radius: 10px; }

        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), transform 0.12s;
            position: relative;
            color: var(--sidebar-text); gap: 8px;
        }
        .file-item:hover { background: var(--sidebar-hover); }
        .file-item.active {
            background: var(--sidebar-active);
            box-shadow: inset 3px 0 0 var(--accent);
            font-weight: 500;
        }
        .file-item-name {
            font-size: 14px; flex: 1;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; padding-right: 4px;
            letter-spacing: 0.1px;
        }
        .file-item-time {
            font-size: 11px; color: var(--sidebar-text-dim);
            flex-shrink: 0;
        }
        .file-item-menu {
            flex-shrink: 0; background: none; border: none;
            cursor: pointer; padding: 4px 6px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: var(--sidebar-text-dim);
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        .file-item-menu:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--sidebar-text);
        }

        .file-list-empty {
            color: var(--sidebar-text-dim); font-size: 13px;
            text-align: center; padding: 40px 16px; opacity: 0.6;
        }

        /* ----- DROPDOWN ----- */
        .dropdown {
            position: absolute; right: 0; top: 110%;
            background: #ffffff; border-radius: var(--radius);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            min-width: 180px; padding: 6px 0;
            display: none; z-index: 200;
            animation: dropFade 0.18s ease-out;
            border: 1px solid var(--sidebar-border);
        }
        .dropdown.open { display: block; }
        @keyframes dropFade {
            from { opacity: 0; transform: scale(0.94) translateY(-8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 16px; font-size: 13px;
            color: var(--sidebar-text);
            border: none; background: none; width: 100%;
            text-align: left; cursor: pointer;
            transition: background 0.12s; border-radius: 0;
            font-family: inherit; letter-spacing: 0.1px;
        }
        .dropdown-item:hover { background: var(--sidebar-hover); }
        .dropdown-item:first-child { border-radius: var(--radius) var(--radius) 0 0; }
        .dropdown-item:last-child  { border-radius: 0 0 var(--radius) var(--radius); }
        .dropdown-item.danger { color: #dc2626; }
        .dropdown-item.danger:hover { background: #fde8e8; }
        .dropdown-item svg { flex-shrink: 0; opacity: 0.7; }

        /* ----- FOOTER SIDEBAR ----- */
        .sidebar-footer {
            flex-shrink: 0; padding: 12px 16px 16px 16px;
            border-top: 1px solid var(--sidebar-border);
            display: flex; justify-content: center; gap: 14px;
        }
        .sidebar-footer a {
            color: var(--sidebar-text-dim);
            transition: color var(--transition), transform 0.15s;
            text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .sidebar-footer a svg { width: 20px; height: 20px; }
        .sidebar-footer a:hover { color: var(--accent); transform: translateY(-2px) scale(1.1); }

        /* ===== MAIN ===== */
        .main {
            flex: 1; display: flex; flex-direction: column;
            height: 100%; min-width: 0;
            background: var(--main-bg);
            position: relative;
        }

        /* ----- HEADER ----- */
        .main-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 28px;
            background: var(--header-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0; min-height: 60px; gap: 12px;
            position: sticky; top: 0; z-index: 10;
        }
        .header-left {
            display: flex; align-items: center; gap: 14px; min-width: 0;
        }
        .hamburger {
            display: none; background: none; border: none;
            cursor: pointer; padding: 6px;
            color: var(--paper-text);
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover { background: rgba(0, 0, 0, 0.05); }

        .file-name-display {
            font-size: 16px; font-weight: 500;
            color: var(--paper-text);
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; max-width: 320px;
            letter-spacing: -0.2px;
        }
        .file-name-display .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: var(--accent);
            margin-right: 10px; vertical-align: middle;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .header-right {
            display: flex; align-items: center; gap: 2px; flex-shrink: 0;
        }
        .btn-icon {
            background: none; border: none;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #5a5a72;
            transition: background var(--transition), color var(--transition), transform 0.12s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon svg { width: 20px; height: 20px; }
        .btn-icon:hover { background: rgba(0, 0, 0, 0.05); color: var(--paper-text); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon-primary:hover {
            background: rgba(79, 110, 247, 0.10);
            color: var(--accent);
        }

        /* ----- PAPER WRAPPER ----- */
        .paper-wrapper {
            flex: 1; min-height: 0;
            padding: 16px 24px 12px 24px;
            overflow-y: auto;
            display: flex; flex-direction: column;
            gap: 16px;
        }

        /* ----- PAPER CARD ----- */
        .paper-card {
            background: var(--paper-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 20px 24px;
            transition: box-shadow var(--transition);
            display: flex; flex-direction: column;
            min-height: 0; flex: 1;
        }
        .paper-card:focus-within {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(79, 110, 247, 0.15);
        }
        #viewGame {
            display: flex; flex-direction: column;
            height: 100%; min-height: 0;
        }
        #viewGame .paper-card { flex: 1; }

        .paper-card .card-title {
            font-size: 15px; font-weight: 600;
            color: var(--paper-text);
            margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; letter-spacing: -0.2px;
            flex-shrink: 0;
        }
        .paper-card .card-title .title-left {
            display: flex; align-items: center; gap: 10px;
        }
        .paper-card .card-title svg { color: var(--accent); }

        .score-badge {
            font-size: 14px; font-weight: 700;
            background: var(--accent); color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px var(--accent-glow);
            min-width: 50px; text-align: center;
        }

        /* ----- GAME BOARD ----- */
        .board-wrapper {
            flex: 1; min-height: 0;
            display: flex; justify-content: center; align-items: center;
            background: #10131f;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
            position: relative;
            padding: 4px;
        }
        .board-wrapper canvas#board {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            image-rendering: pixelated;
        }

        /* ----- KONTROL GAME ----- */
        .controls-row {
            display: flex; flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
        }
        .btn-group {
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-weight: 500; font-size: 12.5px;
            border: none; cursor: pointer;
            transition: background var(--transition), transform 0.12s, box-shadow var(--transition);
            font-family: inherit; white-space: nowrap;
            letter-spacing: 0.2px;
            height: 34px;
        }
        .btn:active { transform: scale(0.94); }
        .btn svg { width: 14px; height: 14px; }

        .btn-primary {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .btn-ghost {
            background: #f0f2f6; color: var(--sidebar-text);
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover { background: #e4e7ee; }

        .btn-spin {
            background: #d97706; color: #fff;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.30);
        }
        .btn-spin:hover {
            background: #b45309;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.40);
        }

        .btn-danger-ghost {
            background: transparent; color: #dc2626;
            border: 1.5px solid #dc2626;
        }
        .btn-danger-ghost:hover { background: #dc2626; color: #fff; }

        .btn-sm { height: 30px; padding: 6px 12px; font-size: 11.5px; }
        .btn-sm svg { width: 12px; height: 12px; }

        /* ----- RIWAYAT DI MAIN ----- */
        .history-header-main {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 14px;
            flex-wrap: wrap; gap: 8px;
        }
        .history-header-main .count-label {
            font-size: 13px; color: var(--sidebar-text-dim);
        }
        .history-list-main {
            display: flex; flex-direction: column; gap: 10px;
        }
        .history-item-main {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 14px;
            background: #f8f9fc;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            flex-wrap: wrap;
        }
        .history-item-main .h-left { flex: 1; min-width: 150px; }
        .history-item-main .h-left .h-score {
            font-size: 15px; font-weight: 600;
            color: var(--paper-text); margin-bottom: 4px;
        }
        .history-item-main .h-left .h-score span {
            color: var(--accent);
        }
        .history-item-main .h-left .h-meta {
            font-size: 11.5px; color: var(--sidebar-text-dim);
        }
        .history-item-main .h-actions {
            display: flex; gap: 6px; flex-shrink: 0;
        }
        .history-empty {
            color: var(--sidebar-text-dim); font-size: 13px;
            text-align: center; padding: 30px 0; opacity: 0.6;
        }

        /* ----- FOOTER ----- */
        .main-footer {
            flex-shrink: 0; padding: 10px 28px 14px 28px;
            background: transparent;
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; flex-wrap: wrap;
            font-size: 12.5px; color: #9a9eb0;
            user-select: none; letter-spacing: 0.3px; font-weight: 400;
        }
        .main-footer .footer-message {
            flex: 1; text-align: center;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            padding: 4px 14px; border-radius: 20px;
            border: 1px solid var(--border-light);
            color: var(--paper-text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            min-width: 0;
        }
        .main-footer .footer-credit {
            flex-shrink: 0;
        }

        /* ----- TOAST ----- */
        .toast-container {
            position: fixed; bottom: 28px; right: 28px;
            z-index: 999; display: flex; flex-direction: column;
            gap: 10px; max-width: 380px; width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 13px 18px;
            border-radius: var(--radius-sm);
            background: #fff; border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            color: var(--paper-text); font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
            pointer-events: auto;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .toast svg { flex-shrink: 0; }
        .toast.success svg { color: var(--toast-success); }
        .toast.error svg   { color: var(--toast-error); }
        .toast.info svg    { color: var(--accent); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ----- MODAL ----- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #ffffff; max-width: 420px; width: 90%;
            padding: 32px 36px 28px 36px;
            border-radius: var(--radius);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.20);
            text-align: center;
            animation: modalSlide 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h3 {
            font-weight: 600; font-size: 20px;
            margin-bottom: 8px; color: var(--paper-text);
            letter-spacing: -0.3px;
        }
        .modal-box p {
            color: #5a5a72; font-size: 15px;
            margin-bottom: 24px; line-height: 1.6;
        }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-actions .btn { min-width: 100px; padding: 10px 0; font-size: 14px; height: auto; }
        .btn-modal-cancel { background: #f0f2f6; color: var(--paper-text); }
        .btn-modal-cancel:hover { background: #e4e7ee; }
        .btn-modal-danger { background: #dc2626; color: white; }
        .btn-modal-danger:hover { background: #b91c1c; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.30); }
        .btn-modal-primary { background: var(--accent); color: white; }
        .btn-modal-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 16px var(--accent-glow); }

        /* ----- SIDEBAR OVERLAY ----- */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px); z-index: 99;
        }
        .sidebar-overlay.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; left: 0;
                transform: translateX(-100%);
                height: 100vh; width: 280px; min-width: 280px;
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.12);
                transition: transform var(--transition);
                z-index: 100; border-right: none;
                border-radius: 0 16px 16px 0;
            }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: flex; }
            .sidebar-overlay.active { display: block; }
            .main-header { padding: 10px 16px; min-height: 54px; }
            .paper-wrapper { padding: 10px 12px 8px 12px; gap: 10px; }
            .paper-card { padding: 14px 14px; }
            .file-name-display { max-width: 130px; font-size: 14px; }
            .file-name-display .dot { width: 6px; height: 6px; margin-right: 6px; }
            .main-footer {
                padding: 8px 12px 10px 12px;
                font-size: 11px;
                flex-direction: column;
                gap: 6px;
            }
            .main-footer .footer-message {
                font-size: 11px;
                padding: 3px 10px;
                width: 100%;
                text-align: center;
            }
            .sidebar-header { padding: 18px 16px 12px 16px; }
            .sidebar-actions { padding: 10px 12px; }
            .btn-sidebar { font-size: 12px; padding: 8px 10px; }
            .file-list-container { padding: 4px 6px 16px 6px; }
            .file-item { padding: 8px 12px; }
            .file-item-name { font-size: 13px; }
            .toast-container { right: 12px; left: 12px; max-width: unset; bottom: 16px; }
            .controls-row { gap: 6px; }
            .btn { padding: 6px 12px; font-size: 11.5px; height: 32px; }
            .score-badge { font-size: 12px; padding: 3px 12px; }
            .history-item-main { flex-direction: column; align-items: stretch; }
            .history-item-main .h-actions { justify-content: flex-end; }
        }

        @media (max-width: 450px) {
            .paper-wrapper { padding: 8px 8px 4px 8px; }
            .paper-card { padding: 10px 10px; }
            .main-header { padding: 6px 10px; min-height: 46px; }
            .btn-icon { padding: 5px 6px; }
            .file-name-display { max-width: 90px; font-size: 12.5px; }
            .header-left { gap: 8px; }
            .sidebar { width: 260px; min-width: 260px; }

        .hidden { display: none !important; }

</head>

        <!-- ===== MAIN ===== -->

    <div class="modal-overlay" id="modalOverlay">

    <script>
        (function() {
            'use strict';

            // ===== DOM REFS =====
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            const themeToggle = document.getElementById('themeToggle');
            const headerTitle = document.getElementById('headerTitle');

            const navGame = document.getElementById('navGame');
            const navHistory = document.getElementById('navHistory');
            const viewGame = document.getElementById('viewGame');
            const viewHistory = document.getElementById('viewHistory');
            const sidebarContent = document.getElementById('sidebarContent');

            const boardCanvas = document.getElementById('board');
            const scoreBadge = document.getElementById('scoreBadge');
            const footerMessage = document.getElementById('footerMessage');

            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const restartBtn = document.getElementById('restartBtn');
            const fullScreenBtn = document.getElementById('fullScreenBtn');
            const moveLeftBtn = document.getElementById('moveLeftBtn');
            const moveRightBtn = document.getElementById('moveRightBtn');
            const moveUpBtn = document.getElementById('moveUpBtn');
            const moveDownBtn = document.getElementById('moveDownBtn');
            const fireBtn = document.getElementById('fireBtn');
            const doubleFireBtn = document.getElementById('doubleFireBtn');

            const historyListMain = document.getElementById('historyListMain');
            const historyCountMain = document.getElementById('historyCountMain');
            const clearHistoryBtnMain = document.getElementById('clearHistoryBtnMain');

            const toastContainer = document.getElementById('toastContainer');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');

            const STORAGE_KEY = 'muthinx_tank_history';

            // ===== ICON SVG =====
            const sunSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
            const moonSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
            const checkSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 10"/></svg>`;
            const errSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
            const infoSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
            const emptyFolderSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;display:block;margin:0 auto 10px auto;opacity:0.4;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;

            // ===== TEMA =====
            function getStoredTheme() {
                return localStorage.getItem('muthinx-theme') || 'light';
            }
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('muthinx-theme', theme);
                themeToggle.innerHTML = theme === 'dark' ? moonSvg : sunSvg;
            }
            setTheme(getStoredTheme());
            themeToggle.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // ===== SIDEBAR =====
            function toggleSidebar(open) {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('active', open);
                }
            }
            hamburger.addEventListener('click', function() {
                toggleSidebar(!sidebar.classList.contains('open'));
            });
            overlay.addEventListener('click', function() { toggleSidebar(false); });
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });

            // ===== TOAST =====
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icon = type === 'success' ? checkSvg : type === 'error' ? errSvg : infoSvg;
                toast.innerHTML = icon + '<span>' + message + '</span>';
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'opacity 0.3s, transform 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // ===== RIWAYAT =====
            function getHistory() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
                catch (_) { return []; }
            }

            function saveHistory(score, enemies, time) {
                const history = getHistory();
                const entry = { score, enemies, time: time || Date.now(), timestamp: Date.now() };
                history.unshift(entry);
                if (history.length > 50) history.pop();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                renderAllHistory();
            }

            function deleteHistoryItem(index) {
                const history = getHistory();
                if (index >= 0 && index < history.length) {
                    history.splice(index, 1);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                    renderAllHistory();
                    showToast('Riwayat dihapus.', 'info');
                }
            }

            function clearAllHistory() {
                if (getHistory().length === 0) {
                    showToast('Riwayat sudah kosong.', 'info');
                    return;
                }
                showModal('⚠️ Hapus semua riwayat?', 'Semua data riwayat akan dihapus permanen.', 'Ya, Hapus Semua', 'danger').then(confirmed => {
                    if (confirmed) {
                        localStorage.removeItem(STORAGE_KEY);
                        renderAllHistory();
                        showToast('Semua riwayat dihapus.', 'success');
                    }
                });
            }

            function escapeHtml(str) {
                if (str === undefined || str === null) return '';
                const div = document.createElement('div');
                div.textContent = String(str);
                return div.innerHTML;
            }

            function renderAllHistory() {
                renderHistoryMain();
                renderHistorySidebar();
            }

            function renderHistoryMain() {
                const history = getHistory();
                historyCountMain.textContent = `${history.length} item`;
                if (history.length === 0) {
                    historyListMain.innerHTML = `<div class="history-empty">Belum ada riwayat pertempuran.</div>`;
                    return;
                }
                let html = '';
                history.forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', {
                        hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short'
                    });
                    html += `
                        <div class="history-item-main">
                            <div class="h-left">
                                <div class="h-score">💥 Skor: <span>${item.score}</span></div>
                                <div class="h-meta">${item.enemies} musuh dilenyapkan · ${time}</div>
                            </div>
                            <div class="h-actions">
                                <button class="btn btn-danger-ghost btn-sm" data-action="delete" data-index="${index}" title="Hapus">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
                historyListMain.innerHTML = html;

                historyListMain.querySelectorAll('button[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        deleteHistoryItem(idx);
                    });
                });
            }

            function renderHistorySidebar() {
                const history = getHistory();
                if (history.length === 0) {
                    sidebarContent.innerHTML = `<div class="file-list-empty">${emptyFolderSvg}Belum ada riwayat</div>`;
                    return;
                }
                let html = '';
                history.slice(0, 15).forEach((item, index) => {
                    const time = new Date(item.timestamp).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div class="file-item" data-index="${index}">
                            <span class="file-item-name">💥 ${item.score} pts</span>
                            <span class="file-item-time">${time}</span>
                            <button class="file-item-menu" data-index="${index}" aria-label="Menu riwayat">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                                </svg>

                            <div class="dropdown" data-index="${index}">
                                <button class="dropdown-item" data-action="show" data-index="${index}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    Lihat Riwayat
                                </button>
                                <button class="dropdown-item danger" data-action="delete" data-index="${index}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    Hapus
                                </button>
                            </div>
                        </div>
                    `;
                });
                sidebarContent.innerHTML = html;

                sidebarContent.querySelectorAll('.file-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.file-item-menu') || e.target.closest('.dropdown')) return;
                        switchView('history');
                        if (window.innerWidth <= 768) toggleSidebar(false);
                    });
                });

                sidebarContent.querySelectorAll('.file-item-menu').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const dropdown = this.parentElement.querySelector('.dropdown');
                        if (!dropdown) return;
                        closeAllDropdowns();
                        dropdown.classList.toggle('open');
                    });
                });

                sidebarContent.querySelectorAll('.dropdown-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const act = this.dataset.action;
                        const idx = parseInt(this.dataset.index);
                        closeAllDropdowns();
                        if (act === 'show') {
                            switchView('history');
                        } else if (act === 'delete') {
                            deleteHistoryItem(idx);
                        }
                    });
                });
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
            }
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.file-item-menu') && !e.target.closest('.dropdown')) {
                    closeAllDropdowns();
                }
            });

            // ===== MODAL =====
            let modalResolve = null;
            function showModal(title, message, confirmLabel = 'OK', type = 'primary') {
                return new Promise((resolve) => {
                    modalTitle.textContent = title;
                    modalMessage.textContent = message;
                    const isDanger = type === 'danger';
                    modalConfirmBtn.className = 'btn ' + (isDanger ? 'btn-modal-danger' : 'btn-modal-primary');
                    modalConfirmBtn.textContent = confirmLabel;
                    modalCancelBtn.textContent = 'Batal';
                    modalOverlay.classList.add('active');
                    modalResolve = resolve;
                });
            }
            modalCancelBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) { modalResolve(false); modalResolve = null; }
            });
            modalConfirmBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                if (modalResolve) { modalResolve(true); modalResolve = null; }
            });
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) { modalResolve(false); modalResolve = null; }
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) { modalResolve(false); modalResolve = null; }
                }
            });

            // ===== SWITCH VIEW =====
            function switchView(view) {
                if (view === 'game') {
                    viewGame.classList.remove('hidden');
                    viewHistory.classList.add('hidden');
                    navGame.classList.add('btn-sidebar-primary');
                    navHistory.classList.remove('btn-sidebar-primary');
                    headerTitle.innerHTML = '<span class="dot"></span>Game';
                } else {
                    viewGame.classList.add('hidden');
                    viewHistory.classList.remove('hidden');
                    navHistory.classList.add('btn-sidebar-primary');
                    navGame.classList.remove('btn-sidebar-primary');
                    headerTitle.innerHTML = '<span class="dot"></span>Riwayat';
                    renderHistoryMain();
                }
                if (window.innerWidth <= 768) toggleSidebar(false);
            }

            navGame.addEventListener('click', function() { switchView('game'); });
            navHistory.addEventListener('click', function() { switchView('history'); });

            // ============================================================
            // TANK GAME ENGINE (logika tidak diubah)
            // ============================================================
            class TankGame {
                constructor() {
                    this.ctx = boardCanvas.getContext('2d');
                    this.rows = 20;
                    this.cols = 10;
                    this.boardBlockSize = 24;
                    this.nextBlockSize = 10;

                    this.status = 'splash';
                    this.intervalId = null;
                    this.score = 0;

                    this.tankShapes = {
                        up:    [[0,1,0],[1,1,1],[1,0,1]],
                        right: [[1,1,0],[0,1,1],[1,1,0]],
                        down:  [[1,0,1],[1,1,1],[0,1,0]],
                        left:  [[0,1,1],[1,1,0],[0,1,1]]
                    };

                    this.enemyColors = ['#f06060', '#f0a060', '#f0f000'];

                    this.player = null;
                    this.enemies = [];
                    this.playerBullets = [];
                    this.enemyBullets = [];

                    this.lastDoubleFire = 0;
                    this.doubleFireCooldown = 3000;
                    this.lastSpawnTime = 0;
                    this.spawnInterval = 5000;
                    this.enemyMoveCounter = 0;
                    this.enemyMoveDelay = 3;

                    this.initGame();
                    this.setupControls();
                    this.setupButtons();

                    const updateFSIcon = () => {
                        const icon = fullScreenBtn.querySelector('svg');
                        if (document.fullscreenElement || document.webkitFullscreenElement) {
                            icon.innerHTML = `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>`;
                        } else {
                            icon.innerHTML = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
                        }
                    };
                    document.addEventListener('fullscreenchange', updateFSIcon);
                    document.addEventListener('webkitfullscreenchange', updateFSIcon);

                    this.resizeBoard();
                    this.drawSplash();

                    window.addEventListener('resize', () => this.handleResize());
                }

                resizeBoard() {
                    const wrapper = boardCanvas.parentElement;
                    const rect = wrapper.getBoundingClientRect();
                    const w = rect.width - 8;
                    const h = rect.height - 8;

                    let blockW = Math.floor(w / this.cols);
                    let blockH = Math.floor(h / this.rows);
                    this.boardBlockSize = Math.max(12, Math.min(blockW, blockH, 32));

                    boardCanvas.width = this.cols * this.boardBlockSize;
                    boardCanvas.height = this.rows * this.boardBlockSize;
                }

                handleResize() {
                    this.resizeBoard();
                    if (this.status === 'running' || this.status === 'paused') {
                        this.draw();
                    } else if (this.status === 'splash' || this.status === 'gameover') {
                        this.drawSplash();
                    }
                }

                initGame() {
                    this.player = {
                        x: 3, y: 17, direction: 'up',
                        shape: this.tankShapes.up.map(row => [...row])
                    };
                    this.enemies = [this.createEnemy()];
                    this.playerBullets = [];
                    this.enemyBullets = [];
                    this.score = 0;
                    this.lastDoubleFire = 0;
                    this.lastSpawnTime = Date.now();
                    this.updateScore();
                }

                createEnemy() {
                    const side = Math.random() < 0.5 ? 'left' : 'right';
                    const x = side === 'left' ? 0 : this.cols - 3;
                    const y = 0;
                    const dirs = ['up', 'down', 'left', 'right'];
                    const dir = dirs[Math.floor(Math.random() * dirs.length)];
                    const ci = Math.floor(Math.random() * this.enemyColors.length);
                    return {
                        x, y, direction: dir,
                        shape: this.tankShapes[dir].map(row => [...row]),
                        color: this.enemyColors[ci]
                    };
                }

                startNewGame() {
                    this.initGame();
                    this.status = 'running';
                    this.startLoop();
                    this.draw();
                    footerMessage.innerHTML = '🎮 Bertempur! Hancurkan semua musuh!';
                }

                startLoop() {
                    if (this.intervalId) clearInterval(this.intervalId);
                    this.intervalId = setInterval(() => this.update(), 200);
                }

                stopLoop() {
                    if (this.intervalId) {
                        clearInterval(this.intervalId);
                        this.intervalId = null;
                    }
                }

                pause() {
                    if (this.status === 'running') {
                        this.status = 'paused';
                        this.stopLoop();
                        this.draw();
                        footerMessage.innerHTML = '⏸️ PAUSED';
                    } else if (this.status === 'paused') {
                        this.status = 'running';
                        this.startLoop();
                        this.draw();
                        footerMessage.innerHTML = '▶️ Melanjutkan...';
                    }
                }

                restart() {
                    this.stopLoop();
                    this.status = 'splash';
                    this.drawSplash();
                    footerMessage.innerHTML = '🔄 Game direset. Tekan START.';
                }

                gameOver() {
                    this.status = 'gameover';
                    this.stopLoop();
                    const enemyCount = this.enemies.length;
                    saveHistory(this.score, enemyCount);
                    this.drawSplash();
                    footerMessage.innerHTML = '💀 GAME OVER · Skor: ' + this.score;
                    showToast('💀 Game Over! Skor: ' + this.score, 'error');
                }

                shapesCollide(shape1, x1, y1, shape2, x2, y2) {
                    for (let r1 = 0; r1 < shape1.length; r1++) {
                        for (let c1 = 0; c1 < shape1[0].length; c1++) {
                            if (!shape1[r1][c1]) continue;
                            const ax = x1 + c1, ay = y1 + r1;
                            if (ax >= x2 && ax < x2 + shape2[0].length && ay >= y2 && ay < y2 + shape2.length) {
                                const r2 = ay - y2, c2 = ax - x2;
                                if (shape2[r2][c2]) return true;
                            }
                        }
                    }
                    return false;
                }

                playerCollidesWithEnemies(nx, ny, ns) {
                    for (let e of this.enemies) {
                        if (this.shapesCollide(ns, nx, ny, e.shape, e.x, e.y)) return true;
                    }
                    return false;
                }

                isValidPlayerPosition(nx, ny, ns) {
                    if (nx < 0 || nx + ns[0].length > this.cols) return false;
                    if (ny < 0 || ny + ns.length > this.rows) return false;
                    return !this.playerCollidesWithEnemies(nx, ny, ns);
                }

                moveUp() {
                    if (this.status !== 'running' || !this.player) return;
                    const ns = this.tankShapes.up;
                    const ny = this.player.y - 1;
                    if (this.isValidPlayerPosition(this.player.x, ny, ns)) {
                        this.player.y = ny;
                        this.player.direction = 'up';
                        this.player.shape = ns.map(row => [...row]);
                        this.draw();
                    }
                }

                moveDown() {
                    if (this.status !== 'running' || !this.player) return;
                    const ns = this.tankShapes.down;
                    const ny = this.player.y + 1;
                    if (this.isValidPlayerPosition(this.player.x, ny, ns)) {
                        this.player.y = ny;
                        this.player.direction = 'down';
                        this.player.shape = ns.map(row => [...row]);
                        this.draw();
                    }
                }

                moveLeft() {
                    if (this.status !== 'running' || !this.player) return;
                    const ns = this.tankShapes.left;
                    const nx = this.player.x - 1;
                    if (this.isValidPlayerPosition(nx, this.player.y, ns)) {
                        this.player.x = nx;
                        this.player.direction = 'left';
                        this.player.shape = ns.map(row => [...row]);
                        this.draw();
                    }
                }

                moveRight() {
                    if (this.status !== 'running' || !this.player) return;
                    const ns = this.tankShapes.right;
                    const nx = this.player.x + 1;
                    if (this.isValidPlayerPosition(nx, this.player.y, ns)) {
                        this.player.x = nx;
                        this.player.direction = 'right';
                        this.player.shape = ns.map(row => [...row]);
                        this.draw();
                    }
                }

                getBulletSpawn(dir, x, y) {
                    switch (dir) {
                        case 'up':    return { x: x + 1, y: y - 1 };
                        case 'down':  return { x: x + 1, y: y + 3 };
                        case 'left':  return { x: x - 1, y: y + 1 };
                        case 'right': return { x: x + 3, y: y + 1 };
                        default:      return { x, y };
                    }
                }

                getDirectionVector(dir) {
                    switch (dir) {
                        case 'up':    return { dx: 0, dy: -1 };
                        case 'down':  return { dx: 0, dy: 1 };
                        case 'left':  return { dx: -1, dy: 0 };
                        case 'right': return { dx: 1, dy: 0 };
                        default:      return { dx: 0, dy: 0 };
                    }
                }

                fire() {
                    if (this.status !== 'running' || !this.player) return;
                    const dir = this.player.direction;
                    const spawn = this.getBulletSpawn(dir, this.player.x, this.player.y);
                    const vec = this.getDirectionVector(dir);
                    this.playerBullets.push({ x: spawn.x, y: spawn.y, dx: vec.dx, dy: vec.dy, color: '#ffffff' });
                }

                doubleFire() {
                    if (this.status !== 'running' || !this.player) return;
                    const now = Date.now();
                    if (now - this.lastDoubleFire < this.doubleFireCooldown) {
                        showToast('⏳ Double Fire cooldown...', 'info');
                        return;
                    }
                    this.lastDoubleFire = now;
                    const dir = this.player.direction;
                    const spawn = this.getBulletSpawn(dir, this.player.x, this.player.y);
                    const vec = this.getDirectionVector(dir);
                    this.playerBullets.push({ x: spawn.x, y: spawn.y, dx: vec.dx, dy: vec.dy, color: '#ff4444' });
                    this.playerBullets.push({ x: spawn.x - vec.dy, y: spawn.y - vec.dx, dx: vec.dx, dy: vec.dy, color: '#ff4444' });
                    showToast('🔥 Double Fire!', 'success');
                }

                spawnEnemy() { this.enemies.push(this.createEnemy()); }

                moveEnemy(enemy) {
                    const dirs = ['up', 'down', 'left', 'right'];
                    const newDir = dirs[Math.floor(Math.random() * dirs.length)];
                    const ns = this.tankShapes[newDir];
                    let nx = enemy.x, ny = enemy.y;
                    switch (newDir) {
                        case 'up':    ny = enemy.y - 1; break;
                        case 'down':  ny = enemy.y + 1; break;
                        case 'left':  nx = enemy.x - 1; break;
                        case 'right': nx = enemy.x + 1; break;
                    }
                    if (nx >= 0 && nx + ns[0].length <= this.cols &&
                        ny >= 0 && ny + ns.length <= this.rows) {
                        if (!this.shapesCollide(ns, nx, ny, this.player.shape, this.player.x, this.player.y)) {
                            enemy.x = nx; enemy.y = ny;
                            enemy.direction = newDir;
                            enemy.shape = ns.map(row => [...row]);
                        }
                    }
                }

                enemyFire(enemy) {
                    const spawn = this.getBulletSpawn(enemy.direction, enemy.x, enemy.y);
                    const vec = this.getDirectionVector(enemy.direction);
                    this.enemyBullets.push({ x: spawn.x, y: spawn.y, dx: vec.dx, dy: vec.dy, color: '#f0f000' });
                }

                update() {
                    if (this.status !== 'running') return;
                    const now = Date.now();

                    if (now - this.lastSpawnTime >= this.spawnInterval) {
                        this.spawnEnemy();
                        this.lastSpawnTime = now;
                    }

                    this.enemyMoveCounter++;
                    if (this.enemyMoveCounter >= this.enemyMoveDelay) {
                        this.enemyMoveCounter = 0;
                        for (let enemy of this.enemies) { this.moveEnemy(enemy); }
                    }

                    for (let enemy of this.enemies) {
                        if (Math.random() < 0.02) { this.enemyFire(enemy); }
                    }

                    for (let i = this.playerBullets.length - 1; i >= 0; i--) {
                        let b = this.playerBullets[i];
                        b.x += b.dx; b.y += b.dy;
                        let hit = false;
                        for (let j = 0; j < this.enemies.length; j++) {
                            let e = this.enemies[j];
                            for (let r = 0; r < e.shape.length; r++) {
                                for (let c = 0; c < e.shape[0].length; c++) {
                                    if (e.shape[r][c] && b.x === e.x + c && b.y === e.y + r) {
                                        this.enemies.splice(j, 1);
                                        this.score += 100;
                                        this.updateScore();
                                        this.playerBullets.splice(i, 1);
                                        hit = true;
                                        break;
                                    }
                                }
                                if (hit) break;
                            }
                            if (hit) break;
                        }
                        if (hit) continue;
                        if (b.y < 0 || b.y >= this.rows || b.x < 0 || b.x >= this.cols) {
                            this.playerBullets.splice(i, 1);
                        }
                    }

                    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
                        let b = this.enemyBullets[i];
                        b.x += b.dx; b.y += b.dy;
                        for (let r = 0; r < this.player.shape.length; r++) {
                            for (let c = 0; c < this.player.shape[0].length; c++) {
                                if (this.player.shape[r][c] && b.x === this.player.x + c && b.y === this.player.y + r) {
                                    this.gameOver();
                                    return;
                                }
                            }
                        }
                        if (b.y < 0 || b.y >= this.rows || b.x < 0 || b.x >= this.cols) {
                            this.enemyBullets.splice(i, 1);
                        }
                    }

                    for (let e of this.enemies) {
                        if (this.shapesCollide(e.shape, e.x, e.y, this.player.shape, this.player.x, this.player.y)) {
                            this.gameOver();
                            return;
                        }
                    }

                    this.draw();
                }

                draw() {
                    const ctx = this.ctx;
                    const bs = this.boardBlockSize;
                    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

                    for (let row = 0; row < this.rows; row++) {
                        for (let col = 0; col < this.cols; col++) {
                            ctx.fillStyle = '#1e2434';
                            ctx.fillRect(col * bs, row * bs, bs - 1, bs - 1);
                        }
                    }

                    for (let e of this.enemies) {
                        ctx.fillStyle = e.color;
                        for (let r = 0; r < e.shape.length; r++) {
                            for (let c = 0; c < e.shape[0].length; c++) {
                                if (e.shape[r][c]) {
                                    ctx.fillRect((e.x + c) * bs, (e.y + r) * bs, bs - 1, bs - 1);
                                }
                            }
                        }
                    }

                    ctx.fillStyle = '#60f060';
                    for (let r = 0; r < this.player.shape.length; r++) {
                        for (let c = 0; c < this.player.shape[0].length; c++) {
                            if (this.player.shape[r][c]) {
                                ctx.fillRect((this.player.x + c) * bs, (this.player.y + r) * bs, bs - 1, bs - 1);
                            }
                        }
                    }

                    for (let b of this.playerBullets) {
                        ctx.fillStyle = b.color;
                        ctx.fillRect(b.x * bs, b.y * bs, bs - 1, bs - 1);
                    }

                    for (let b of this.enemyBullets) {
                        ctx.fillStyle = b.color;
                        ctx.fillRect(b.x * bs, b.y * bs, bs - 1, bs - 1);
                    }

                    if (this.status === 'paused') {
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${Math.floor(bs * 1.2)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText('PAUSED', boardCanvas.width / 2, boardCanvas.height / 2);
                    }
                }

                drawSplash() {
                    const ctx = this.ctx;
                    const w = boardCanvas.width;
                    const h = boardCanvas.height;
                    ctx.clearRect(0, 0, w, h);
                    ctx.fillStyle = '#10131f';
                    ctx.fillRect(0, 0, w, h);

                    const bs = this.boardBlockSize;
                    const startX = (w - 10 * bs) / 2;
                    const startY = (h - 20 * bs) / 2;

                    const up = this.tankShapes.up;
                    for (let r = 0; r < 3; r++) {
                        for (let c = 0; c < 3; c++) {
                            if (up[r][c]) {
                                ctx.fillStyle = '#60f060';
                                ctx.fillRect(startX + c * bs, startY + r * bs, bs - 1, bs - 1);
                            }
                        }
                    }

                    for (let i = 0; i < 3; i++) {
                        const ox = 7 + i * 3;
                        ctx.fillStyle = this.enemyColors[i];
                        const shape = this.tankShapes.up;
                        for (let r = 0; r < 3; r++) {
                            for (let c = 0; c < 3; c++) {
                                if (shape[r][c]) {
                                    ctx.fillRect(startX + (ox + c) * bs, startY + (17 + r) * bs, bs - 1, bs - 1);
                                }
                            }
                        }
                    }

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.floor(bs * 0.8)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('TANK WAR', w / 2, startY + 10 * bs);
                    ctx.fillStyle = '#aaa';
                    ctx.font = `${Math.floor(bs * 0.4)}px sans-serif`;
                    ctx.fillText('Press START', w / 2, h - 20);
                }

                updateScore() {
                    scoreBadge.textContent = this.score;
                }

                setupControls() {
                    window.addEventListener('keydown', (e) => {
                        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                            e.preventDefault();
                        }
                        if (this.status !== 'running') return;
                        switch (e.key) {
                            case 'ArrowLeft':  this.moveLeft(); break;
                            case 'ArrowRight': this.moveRight(); break;
                            case 'ArrowDown':  this.moveDown(); break;
                            case 'ArrowUp':    this.moveUp(); break;
                            case ' ':
                            case 'b':
                            case 'B':
                                e.preventDefault();
                                this.fire();
                                break;
                            case 'a':
                            case 'A':
                                e.preventDefault();
                                this.doubleFire();
                                break;
                        }
                    });
                }

                setupButtons() {
                    startBtn.addEventListener('click', () => {
                        if (this.status === 'splash' || this.status === 'gameover') {
                            this.startNewGame();
                        } else if (this.status === 'paused') {
                            this.pause();
                        }
                    });
                    pauseBtn.addEventListener('click', () => this.pause());
                    restartBtn.addEventListener('click', () => this.restart());
                    moveLeftBtn.addEventListener('click', () => this.moveLeft());
                    moveRightBtn.addEventListener('click', () => this.moveRight());
                    moveUpBtn.addEventListener('click', () => this.moveUp());
                    moveDownBtn.addEventListener('click', () => this.moveDown());
                    fireBtn.addEventListener('click', () => this.fire());
                    doubleFireBtn.addEventListener('click', () => this.doubleFire());

                    fullScreenBtn.addEventListener('click', () => {
                        const elem = document.documentElement;
                        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                            if (elem.requestFullscreen) elem.requestFullscreen();
                            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                        } else {
                            if (document.exitFullscreen) document.exitFullscreen();
                            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        }
                    });
                }
            }

            // ===== INISIALISASI =====
            clearHistoryBtnMain.addEventListener('click', clearAllHistory);

            renderAllHistory();
            switchView('game');

            const game = new TankGame();
            window.tankGame = game;

            console.log('🎮 Tank War siap.');
        })();
    </script>
